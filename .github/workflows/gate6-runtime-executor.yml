name: Execute protected Gate 6 runtime delivery

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      artifact_run_id:
        required: true
        type: string
      final_verifier_artifact_id:
        required: false
        default: ""
        type: string
      final_verifier_run_id:
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  deliver:
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: spx-production-mutation
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: read
    env:
      OPERATION: ${{ inputs.operation }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      FINAL_VERIFIER_ARTIFACT_ID: ${{ inputs.final_verifier_artifact_id }}
      FINAL_VERIFIER_RUN_ID: ${{ inputs.final_verifier_run_id }}
      EXPECTED_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_GATE6_RUNTIME_EXECUTOR_SHA }}
      ENVELOPE_SIGNER_SHA: ${{ vars.SPX_TRUSTED_GATE6_ENVELOPE_SIGNER_SHA }}
      LINE_PERMIT_SIGNER_SHA: ${{ vars.SPX_TRUSTED_GATE6_LINE_PERMIT_SIGNER_SHA }}
      OCR_PERMIT_SIGNER_SHA: ${{ vars.SPX_TRUSTED_GATE6_OCR_PERMIT_SIGNER_SHA }}
      POSTPROOF_SIGNER_SHA: ${{ vars.SPX_TRUSTED_GATE6_POSTPROOF_SIGNER_SHA }}
    steps:
      - name: Checkout only the trusted runtime consumer definition
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/gate6-runtime-executor.yml
            deploy/protected-evidence-producers.json
            scripts/lib/evidence-artifact.mjs
            scripts/lib/github-attestation-run.mjs
            scripts/lib/protected-evidence-producers.mjs
          sparse-checkout-cone-mode: false

      - name: Validate the hard-coded delivery selector
        shell: bash
        env:
          TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${OPERATION}" =~ ^(admit|permit-register-line|permit-register-ocr|postproof-register|abort|seal-close|release)$ ]]
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${TRUSTED_WORKFLOW_SHA}" = "${EXPECTED_WORKFLOW_SHA}"
          for signer_sha in \
            "${ENVELOPE_SIGNER_SHA}" "${LINE_PERMIT_SIGNER_SHA}" \
            "${OCR_PERMIT_SIGNER_SHA}" "${POSTPROOF_SIGNER_SHA}"; do
            [[ "${signer_sha}" =~ ^[0-9a-f]{40}$ ]]
          done
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          if [ "${OPERATION}" = release ]; then
            [[ "${FINAL_VERIFIER_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${FINAL_VERIFIER_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          else
            test -z "${FINAL_VERIFIER_ARTIFACT_ID}"
            test -z "${FINAL_VERIFIER_RUN_ID}"
          fi

      - name: Resolve the exact final-verifier producer
        if: inputs.operation == 'release'
        id: final-producer
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFile } from "node:fs/promises";
          import { producerFor } from "./scripts/lib/protected-evidence-producers.mjs";
          const producer = producerFor("final-verifier");
          if (
            producer.bootstrapDenied !== false
            || /^0{40}$/.test(producer.signerSha)
            || /^0{64}$/.test(producer.workflowFileSha256)
          ) throw new Error("final-verifier producer is bootstrap-denied");
          await appendFile(process.env.GITHUB_OUTPUT, `workflow=${producer.workflow}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `sha=${producer.signerSha}\n`);
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `workflow_file_sha256=${producer.workflowFileSha256}\n`,
          );
          NODE

      - name: Download only the selected signed approval artifact bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          digest-mismatch: error
          path: verified-input/approval

      - name: Download the separate final verifier artifact for release
        if: inputs.operation == 'release'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.final_verifier_artifact_id }}
          run-id: ${{ inputs.final_verifier_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          digest-mismatch: error
          path: verified-input/final-verifier

      - name: Verify every approval artifact attestation
        id: verified-attestations
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_VERIFIER_WORKFLOW: ${{ steps.final-producer.outputs.workflow }}
          FINAL_VERIFIER_SIGNER_SHA: ${{ steps.final-producer.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          binding_dir="${RUNNER_TEMP}/spx-attestation-run-bindings"
          install -d -m 0700 "${binding_dir}"
          fetch_artifact_metadata() {
            local artifact_id="$1"
            local destination="$2"
            local artifact_projection="${destination}.artifact"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              --jq '{artifactId:(.id|tostring),expired:.expired,workflowHeadSha:.workflow_run.head_sha,workflowRepositoryId:(.workflow_run.repository_id|tostring),workflowRunId:(.workflow_run.id|tostring)}' \
              > "${artifact_projection}"
            local authoritative_run_id
            authoritative_run_id="$(jq -er '.workflowRunId' "${artifact_projection}")"
            local workflow_run_attempt
            workflow_run_attempt="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${authoritative_run_id}" \
                --jq '.run_attempt | tostring'
            )"
            [[ "${workflow_run_attempt}" =~ ^[1-9][0-9]*$ ]]
            jq -e --arg workflowRunAttempt "${workflow_run_attempt}" \
              '. + {workflowRunAttempt:$workflowRunAttempt}' \
              "${artifact_projection}" > "${destination}"
            rm -f "${artifact_projection}"
            chmod 0600 "${destination}"
          }
          verify_attested_file() {
            local file="$1"
            local artifact_id="$2"
            local run_id="$3"
            local signer_workflow="$4"
            local signer_sha="$5"
            local artifact_metadata="$6"
            local attestation_results
            attestation_results="$(mktemp "${binding_dir}/attestation.XXXXXX.json")"
            if ! gh attestation verify "${file}" -R "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/${signer_workflow}" \
              --signer-digest "${signer_sha}" --deny-self-hosted-runners \
              --format json > "${attestation_results}"; then
              rm -f "${attestation_results}"
              return 1
            fi
            if ! node scripts/lib/github-attestation-run.mjs \
              --artifact="${file}" \
              --artifact-id="${artifact_id}" \
              --artifact-metadata="${artifact_metadata}" \
              --attestation-results="${attestation_results}" \
              --repository="${GITHUB_REPOSITORY}" \
              --run-id="${run_id}" \
              --signer-sha="${signer_sha}" \
              --signer-workflow="${signer_workflow}"; then
              rm -f "${attestation_results}"
              return 1
            fi
            rm -f "${attestation_results}"
          }
          approval_metadata="${binding_dir}/approval.metadata.json"
          fetch_artifact_metadata "${ARTIFACT_ID}" "${approval_metadata}"
          found=0
          while IFS= read -r -d '' file; do
            found=1
            test ! -L "${file}"
            test -s "${file}"
            test "$(stat -c %s "${file}")" -le 16777216
            case "${OPERATION}" in
              admit|abort|seal-close|release)
                signer_workflow=".github/workflows/gate6-envelope-signer.yml"
                signer_sha="${ENVELOPE_SIGNER_SHA}"
                ;;
              permit-register-line)
                signer_workflow=".github/workflows/gate6-line-permit-signer.yml"
                signer_sha="${LINE_PERMIT_SIGNER_SHA}"
                ;;
              permit-register-ocr)
                signer_workflow=".github/workflows/gate6-ocr-permit-signer.yml"
                signer_sha="${OCR_PERMIT_SIGNER_SHA}"
                ;;
              postproof-register)
                signer_workflow=".github/workflows/gate6-postproof-principal-signer.yml"
                signer_sha="${POSTPROOF_SIGNER_SHA}"
                ;;
              *) exit 1 ;;
            esac
            verify_attested_file \
              "${file}" "${ARTIFACT_ID}" "${ARTIFACT_RUN_ID}" \
              "${signer_workflow}" "${signer_sha}" "${approval_metadata}" >/dev/null
          done < <(find verified-input/approval -type f -print0 | sort -z)
          test "${found}" = 1
          if [ "${OPERATION}" = release ]; then
            final_metadata="${binding_dir}/final-verifier.metadata.json"
            fetch_artifact_metadata "${FINAL_VERIFIER_ARTIFACT_ID}" "${final_metadata}"
            final_binding="$(verify_attested_file \
              verified-input/final-verifier/final-verifier.json \
              "${FINAL_VERIFIER_ARTIFACT_ID}" "${FINAL_VERIFIER_RUN_ID}" \
              "${FINAL_VERIFIER_WORKFLOW}" "${FINAL_VERIFIER_SIGNER_SHA}" \
              "${final_metadata}")"
            final_subject_sha256="$(jq -er '.subjectSha256' <<<"${final_binding}")"
            [[ "${final_subject_sha256}" =~ ^[0-9a-f]{64}$ ]]
            printf 'final_subject_sha256=%s\n' "${final_subject_sha256}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify the exact separately produced final verifier
        if: inputs.operation == 'release'
        id: final-verifier
        env:
          ATTESTED_FINAL_SHA256: ${{ steps.verified-attestations.outputs.final_subject_sha256 }}
          FINAL_VERIFIER_WORKFLOW: ${{ steps.final-producer.outputs.workflow }}
          FINAL_VERIFIER_SIGNER_SHA: ${{ steps.final-producer.outputs.sha }}
          FINAL_VERIFIER_WORKFLOW_FILE_SHA256: ${{ steps.final-producer.outputs.workflow_file_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${FINAL_VERIFIER_SIGNER_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${FINAL_VERIFIER_SIGNER_SHA}" != 0000000000000000000000000000000000000000
          [[ "${FINAL_VERIFIER_WORKFLOW_FILE_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          mapfile -t release_files < <(find verified-input/approval -type f -name gate6-release.json -print)
          test "${#release_files[@]}" -eq 1
          export GATE6_RELEASE_FILE="${release_files[0]}"
          expected_final_sha256="$(sha256sum verified-input/final-verifier/final-verifier.json | cut -d' ' -f1)"
          [[ "${ATTESTED_FINAL_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "${expected_final_sha256}" = "${ATTESTED_FINAL_SHA256}"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { assertProtectedEvidenceFileSet } from "./scripts/lib/protected-evidence-producers.mjs";
          const canonical = (value) => Array.isArray(value)
            ? value.map(canonical)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
              : value;
          const canonicalJson = (value) => JSON.stringify(canonical(value));
          const finalSet = await assertProtectedEvidenceFileSet(
            "final-verifier",
            "verified-input/final-verifier",
          );
          const finalFile = finalSet.files[0];
          if (finalFile?.name !== "final-verifier.json") {
            throw new Error("final-verifier protected file set is invalid");
          }
          const releaseBytes = await readFile(process.env.GATE6_RELEASE_FILE);
          const release = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(releaseBytes));
          if (!releaseBytes.equals(Buffer.from(canonicalJson(release)))) {
            throw new Error("Gate 6 release action is not canonical JSON");
          }
          const verifier = finalFile.value;
          if (
            release?.scope !== "gate6-release"
            || release?.candidateSha !== process.env.CANDIDATE_SHA
            || !/^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(release?.gate6Id ?? "")
            || verifier?.ok !== true
            || verifier.evidence?.phase !== "final"
            || verifier.evidence?.candidateSha !== release.candidateSha
            || verifier.evidence?.gate6Id !== release.gate6Id
            || verifier.evidence?.runStatus !== "sealed-verifying"
            || verifier.evidence?.runStage !== "sealed-verifying"
            || verifier.evidence?.slotState !== "sealed-verifying"
            || !/^[0-9a-f]{64}$/.test(verifier.evidence?.terminalEvidenceSha256 ?? "")
            || verifier.evidenceSha256 !== createHash("sha256")
              .update(canonicalJson(verifier.evidence)).digest("hex")
          ) throw new Error("final-verifier release and terminal binding mismatch");
          NODE
          test "$(sha256sum verified-input/final-verifier/final-verifier.json | cut -d' ' -f1)" = \
            "${expected_final_sha256}"
          printf 'sha256=%s\n' "${expected_final_sha256}" >> "${GITHUB_OUTPUT}"

      - name: Select the exact bounded delivery file set
        env:
          VERIFIED_FINAL_SHA256: ${{ steps.final-verifier.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 delivery-input
          if [ "${OPERATION}" = release ]; then
            mapfile -t release_files < <(find verified-input/approval -type f -name gate6-release.json -print)
            test "${#release_files[@]}" -eq 1
            [[ "${VERIFIED_FINAL_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            test "$(sha256sum verified-input/final-verifier/final-verifier.json | cut -d' ' -f1)" = \
              "${VERIFIED_FINAL_SHA256}"
            install -m 0400 "${release_files[0]}" delivery-input/gate6-release.json
            install -m 0400 verified-input/final-verifier/final-verifier.json \
              delivery-input/final-verifier.json
            test "$(sha256sum delivery-input/final-verifier.json | cut -d' ' -f1)" = \
              "${VERIFIED_FINAL_SHA256}"
            mapfile -t delivery_files < <(find delivery-input -maxdepth 1 -type f -printf '%f\n' | sort)
            test "${#delivery_files[@]}" -eq 2
            test "${delivery_files[0]}" = final-verifier.json
            test "${delivery_files[1]}" = gate6-release.json
          else
            cp -a verified-input/approval/. delivery-input/
            test -n "$(find delivery-input -type f -print -quit)"
          fi
          test -z "$(find delivery-input -type l -print -quit)"

      - name: Create deterministic bounded delivery payload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(find delivery-input -type f | wc -l)" -le 128
          test -z "$(find delivery-input -type l -print -quit)"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf gate6-delivery.tar -C delivery-input .
          test "$(stat -c %s gate6-delivery.tar)" -le 67108864
          sha256sum gate6-delivery.tar | cut -d' ' -f1 > gate6-delivery.sha256

      - name: Configure pinned SSH host identity
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_KNOWN_HOSTS: ${{ secrets.SPX_KNOWN_HOSTS }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_SSH_KEY: ${{ secrets.SPX_SSH_KEY }}
          EXPECTED_KNOWN_HOSTS_SHA256: ${{ vars.SPX_KNOWN_HOSTS_SHA256 }}
        run: |
          set -euo pipefail
          [[ "${SPX_HOST}" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "${SPX_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${EXPECTED_KNOWN_HOSTS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test -n "${SPX_KNOWN_HOSTS}"
          test -n "${SPX_SSH_KEY}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SPX_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${SPX_SSH_KEY}" > ~/.ssh/spx_gate6_key
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/spx_gate6_key
          test "$(sha256sum ~/.ssh/known_hosts | cut -d' ' -f1)" = "${EXPECTED_KNOWN_HOSTS_SHA256}"
          lookup="${SPX_HOST}"
          if [ "${SPX_PORT}" != 22 ]; then lookup="[${SPX_HOST}]:${SPX_PORT}"; fi
          ssh-keygen -F "${lookup}" -f ~/.ssh/known_hosts >/dev/null

      - name: Deliver and execute through the immutable Gate 6 controller
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
        run: |
          set -euo pipefail
          [[ "${SPX_USER}" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]
          payload_sha256="$(cat gate6-delivery.sha256)"
          remote_payload="/tmp/spx-gate6-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar"
          scp -q -P "${SPX_PORT}" -i ~/.ssh/spx_gate6_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            gate6-delivery.tar "${SPX_USER}@${SPX_HOST}:${remote_payload}"
          ssh -p "${SPX_PORT}" -i ~/.ssh/spx_gate6_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SPX_USER}@${SPX_HOST}" \
            sudo bash -s -- "${OPERATION}" "${CANDIDATE_SHA}" "${payload_sha256}" "${remote_payload}" <<'REMOTE'
          set -eEuo pipefail
          operation="$1"
          candidate_sha="$2"
          expected_payload_sha256="$3"
          payload="$4"
          [[ "${operation}" =~ ^(admit|permit-register-line|permit-register-ocr|postproof-register|abort|seal-close|release)$ ]]
          [[ "${candidate_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${expected_payload_sha256}" =~ ^[0-9a-f]{64}$ ]]
          test -f "${payload}"
          test ! -L "${payload}"
          test "$(sha256sum "${payload}" | cut -d' ' -f1)" = "${expected_payload_sha256}"
          operator_root="/root/spx-releases/${candidate_sha}/operator"
          test -d "${operator_root}"
          test ! -L "${operator_root}"
          test -f "${operator_root}/scripts/gate6-runtime-control.mjs"
          incoming="/var/lib/spx-gate6/incoming/${candidate_sha}-${operation}"
          test ! -e "${incoming}"
          install -d -m 0700 "${incoming}"
          case "${incoming}" in /var/lib/spx-gate6/incoming/[0-9a-f]*-*) ;; *) exit 1 ;; esac
          case "${payload}" in /tmp/spx-gate6-[0-9]*-[0-9]*.tar) ;; *) exit 1 ;; esac
          cleanup_delivery() {
            rm -rf -- "${incoming}"
            rm -f -- "${payload}"
          }
          trap cleanup_delivery EXIT
          mapfile -t entries < <(tar -tf "${payload}")
          test "${#entries[@]}" -gt 0
          test "${#entries[@]}" -le 256
          for entry in "${entries[@]}"; do
            test -n "${entry}"
            case "${entry}" in
              /*|*\\*|*../*|../*|*/..|..) exit 1 ;;
            esac
          done
          tar --no-same-owner --no-same-permissions -xf "${payload}" -C "${incoming}"
          rm -f -- "${payload}"
          test -z "$(find "${incoming}" -type l -print -quit)"
          find "${incoming}" -type d -exec chmod 0700 {} +
          find "${incoming}" -type f -exec chmod 0400 {} +

          artifacts=/var/lib/spx-gate6/artifacts
          actions=/var/lib/spx-gate6/actions
          permits=/var/lib/spx-gate6/permits
          postproof=/var/lib/spx-gate6/postproof
          install -d -m 0700 "${artifacts}" "${actions}" "${permits}" "${postproof}"
          single_file() {
            local name="$1"
            mapfile -t matches < <(find "${incoming}" -type f -name "${name}" -print)
            test "${#matches[@]}" -eq 1
            printf '%s\n' "${matches[0]}"
          }
          install_once() {
            local source="$1" destination="$2"
            if [ -e "${destination}" ]; then cmp -s "${source}" "${destination}"; return; fi
            install -m 0400 "${source}" "${destination}.new"
            mv -T "${destination}.new" "${destination}"
          }
          envelope="${artifacts}/gate6-envelope.json"
          release="${artifacts}/release-manifest.json"
          runtime=(/usr/bin/node "${operator_root}/scripts/gate6-runtime-control.mjs")

          case "${operation}" in
            admit)
              install_once "$(single_file gate6-envelope.json)" "${envelope}"
              install_once "$(single_file release-manifest.json)" "${release}"
              while IFS= read -r action; do
                name="$(basename "${action}")"
                install_once "${action}" "${actions}/${name}"
              done < <(find "${incoming}" -type f -path '*/actions/*.json' -print | sort)
              operation_id="$(/usr/bin/node --input-type=module -e \
                'import {readFileSync} from "node:fs"; const v=JSON.parse(readFileSync("/var/lib/spx-production-mutation/lock.json","utf8")); if(!/^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$/.test(v.operationId??"")) process.exit(1); process.stdout.write(v.operationId)')"
              "${runtime[@]}" --action=admit-and-supervise --operation-id="${operation_id}" \
                --envelope="${envelope}" --action-approval="${actions}/gate6-admit.json" --release="${release}"
              ;;
            permit-register-line)
              install_once "$(single_file task9-line-boundary.json)" "${permits}/task9-line-boundary.json"
              /usr/bin/docker compose -p spx-production --env-file /etc/spx-production/runtime.env \
                -f "${operator_root}/docker-compose.yml" --profile gate6 run --rm --no-deps gate6-task9-controller \
                node scripts/production-task9-controller.mjs --action=line-boundary-retry \
                --envelope=/run/gate6/artifacts/gate6-envelope.json \
                --action-approval=/run/gate6/actions/task9-line-boundary.json \
                --permit=/run/gate6/permits/task9-line-boundary.json \
                --release=/run/gate6/artifacts/release-manifest.json
              ;;
            permit-register-ocr)
              install_once "$(single_file task9-ocr-boundary.json)" "${permits}/task9-ocr-boundary.json"
              /usr/bin/docker compose -p spx-production --env-file /etc/spx-production/runtime.env \
                -f "${operator_root}/docker-compose.yml" --profile gate6 run --rm --no-deps gate6-task9-controller \
                node scripts/production-task9-controller.mjs --action=ocr-boundary-recovery \
                --envelope=/run/gate6/artifacts/gate6-envelope.json \
                --action-approval=/run/gate6/actions/task9-ocr-boundary.json \
                --permit=/run/gate6/permits/task9-ocr-boundary.json \
                --release=/run/gate6/artifacts/release-manifest.json
              ;;
            postproof-register)
              install_once "$(single_file postproof-actions.json)" "${postproof}/postproof-actions.json"
              "${runtime[@]}" --action=register-postproof --envelope="${envelope}" --release="${release}" \
                --postproof-bundle="${postproof}/postproof-actions.json"
              ;;
            abort)
              install_once "$(single_file gate6-abort.json)" "${actions}/gate6-abort.json"
              "${runtime[@]}" --action=abort --envelope="${envelope}" \
                --action-approval="${actions}/gate6-abort.json" --release="${release}"
              ;;
            seal-close)
              install_once "$(single_file gate6-seal-close.json)" "${actions}/gate6-seal-close.json"
              "${runtime[@]}" --action=seal-close --envelope="${envelope}" \
                --action-approval="${actions}/gate6-seal-close.json" --release="${release}"
              ;;
            release)
              install_once "$(single_file gate6-release.json)" "${actions}/gate6-release.json"
              final_verifier=/var/lib/spx-production-rollout/evidence/final-verifier.json
              install_once "$(single_file final-verifier.json)" "${final_verifier}"
              "${runtime[@]}" --action=release --envelope="${envelope}" \
                --action-approval="${actions}/gate6-release.json" --release="${release}" \
                --final-verifier="${final_verifier}"
              test -f "${final_verifier}"
              test ! -L "${final_verifier}"
              test "$(stat -c %u "${final_verifier}")" -eq 0
              test "$(stat -c %a "${final_verifier}")" = 400
              rm -f -- "${final_verifier}"
              /usr/bin/node --input-type=module <<'NODE'
              import { constants } from "node:fs";
              import { open } from "node:fs/promises";
              const directory = await open(
                "/var/lib/spx-production-rollout/evidence",
                constants.O_RDONLY,
              );
              try { await directory.sync(); } finally { await directory.close(); }
              NODE
              ;;
          esac
          REMOTE
