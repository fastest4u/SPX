name: Trusted protected staging evidence exporter

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release source SHA
        required: true
        type: string
      release_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      release_run_id:
        description: Immutable release workflow run ID
        required: true
        type: string
      staging_target_artifact_id:
        description: Attested staging target descriptor artifact ID
        required: true
        type: string
      staging_target_run_id:
        description: Staging target descriptor workflow run ID
        required: true
        type: string
      staging_approval_artifact_id:
        description: Signed staging approval artifact ID
        required: true
        type: string
      staging_approval_run_id:
        description: Staging approval workflow run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: spx-staging-a3
  cancel-in-progress: false

jobs:
  export-protected-evidence:
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Validate immutable selectors and protected workflow identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          STAGING_TARGET_ARTIFACT_ID: ${{ inputs.staging_target_artifact_id }}
          STAGING_TARGET_RUN_ID: ${{ inputs.staging_target_run_id }}
          STAGING_APPROVAL_ARTIFACT_ID: ${{ inputs.staging_approval_artifact_id }}
          STAGING_APPROVAL_RUN_ID: ${{ inputs.staging_approval_run_id }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          TRUSTED_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_STAGING_PROTECTED_EVIDENCE_WORKFLOW_SHA }}
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          for selector in \
            "${RELEASE_ARTIFACT_ID}" "${RELEASE_RUN_ID}" \
            "${STAGING_TARGET_ARTIFACT_ID}" "${STAGING_TARGET_RUN_ID}" \
            "${STAGING_APPROVAL_ARTIFACT_ID}" "${STAGING_APPROVAL_RUN_ID}"; do
            [[ "${selector}" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "${WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${WORKFLOW_SHA}" != 0000000000000000000000000000000000000000
          test "${WORKFLOW_SHA}" = "${TRUSTED_WORKFLOW_SHA}"

      - name: Checkout only immutable trusted workflow code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ job.workflow_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Prove trusted checkout and workflow file identity
        id: trusted
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "${WORKFLOW_SHA}"
          test -z "$(git -C trusted status --short --untracked-files=no)"
          WORKFLOW_FILE=trusted/.github/workflows/trusted-staging-protected-evidence.yml
          test -f "${WORKFLOW_FILE}"
          echo "workflow_file_sha256=$(sha256sum "${WORKFLOW_FILE}" | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Download exact release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.release_artifact_id }}
          run-id: ${{ inputs.release_run_id }}
          path: inert-inputs/release
          github-token: ${{ github.token }}

      - name: Download exact staging target artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.staging_target_artifact_id }}
          run-id: ${{ inputs.staging_target_run_id }}
          path: inert-inputs/target
          github-token: ${{ github.token }}

      - name: Download exact staging approval artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.staging_approval_artifact_id }}
          run-id: ${{ inputs.staging_approval_run_id }}
          path: inert-inputs/approval
          github-token: ${{ github.token }}

      - name: Enforce exact inert upstream file sets and candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          test -z "$(find inert-inputs -type l -print -quit)"
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises";
          import { relative, resolve } from "node:path";

          const files = async (root) => {
            const output = [];
            const visit = async (directory) => {
              for (const entry of await readdir(directory, { withFileTypes: true })) {
                const path = resolve(directory, entry.name);
                if (entry.isSymbolicLink() || (!entry.isFile() && !entry.isDirectory())) throw new Error("unsafe artifact entry");
                if (entry.isDirectory()) await visit(path);
                else output.push(relative(resolve(root), path).replaceAll("\\", "/"));
              }
            };
            await visit(root);
            return output.sort();
          };
          const exact = (actual, expected, label) => {
            if (JSON.stringify(actual) !== JSON.stringify([...expected].sort())) throw new Error(`${label} file set changed`);
          };

          const releaseRoot = "inert-inputs/release";
          const releaseIndex = JSON.parse(await readFile(`${releaseRoot}/release-artifact.index.json`, "utf8"));
          if (releaseIndex.sourceSha !== process.env.CANDIDATE_SHA || !Array.isArray(releaseIndex.files)) throw new Error("release candidate mismatch");
          exact(await files(releaseRoot), ["release-artifact.index.json", ...releaseIndex.files.map((entry) => entry.path)], "release artifact");

          exact(await files("inert-inputs/target"), [
            "deployment-target-descriptor.attestation-claims.json",
            "deployment-target-descriptor.json",
          ], "target artifact");

          const approvalRoot = "inert-inputs/approval";
          const envelope = JSON.parse(await readFile(`${approvalRoot}/signed-envelope.json`, "utf8"));
          const actionIndex = JSON.parse(await readFile(`${approvalRoot}/action-index.json`, "utf8"));
          if (envelope?.release?.candidateSha !== process.env.CANDIDATE_SHA || !Array.isArray(actionIndex.actions) || actionIndex.actions.length === 0) throw new Error("approval candidate mismatch");
          const actionFiles = actionIndex.actions.flatMap((entry, offset) => {
            const expected = `${String(offset + 1).padStart(3, "0")}-${entry.actionId}.action.json`;
            if (entry.sequence !== offset + 1 || entry.filename !== expected) throw new Error("approval action index changed");
            return [entry.filename, `${entry.filename}.attestation.json`];
          });
          exact(await files(approvalRoot), [
            "action-index.attestation.json",
            "action-index.json",
            "signed-envelope.json",
            "staging-rollout-approval.attestation-claims.json",
            ...actionFiles,
          ], "approval artifact");
          NODE

      - name: Verify every inert upstream subject attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_RELEASE_WORKFLOW_SHA }}
          TARGET_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_DESCRIPTOR_SIGNER_SHA }}
          APPROVAL_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_STAGING_SIGNER_SHA }}
        run: |
          set -euo pipefail
          for digest in "${RELEASE_WORKFLOW_SHA}" "${TARGET_WORKFLOW_SHA}" "${APPROVAL_WORKFLOW_SHA}"; do
            [[ "${digest}" =~ ^[0-9a-f]{40}$ ]]
          done
          while IFS= read -r -d '' path; do
            gh attestation verify "${path}" -R fastest4u/SPX \
              --signer-workflow fastest4u/SPX/.github/workflows/trusted-release-artifact.yml \
              --signer-digest "${RELEASE_WORKFLOW_SHA}" --deny-self-hosted-runners >/dev/null
          done < <(find inert-inputs/release -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            gh attestation verify "${path}" -R fastest4u/SPX \
              --signer-workflow fastest4u/SPX/.github/workflows/deployment-target-descriptor-signer.yml \
              --signer-digest "${TARGET_WORKFLOW_SHA}" --deny-self-hosted-runners >/dev/null
          done < <(find inert-inputs/target -type f -print0 | sort -z)
          while IFS= read -r -d '' path; do
            gh attestation verify "${path}" -R fastest4u/SPX \
              --signer-workflow fastest4u/SPX/.github/workflows/staging-rollout-signer.yml \
              --signer-digest "${APPROVAL_WORKFLOW_SHA}" --deny-self-hosted-runners >/dev/null
          done < <(find inert-inputs/approval -type f -print0 | sort -z)

      - name: Package only trusted exporter code and fixed producer context
        id: payload
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_SHA256: ${{ steps.trusted.outputs.workflow_file_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e trusted-exporter-payload
          install -d -m 0700 trusted-exporter-payload
          cp -a trusted/scripts trusted-exporter-payload/scripts
          WORKFLOW_SHA="${WORKFLOW_SHA}" WORKFLOW_FILE_SHA256="${WORKFLOW_FILE_SHA256}" node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const canonical = (value) => JSON.stringify(Object.fromEntries(Object.keys(value).sort().map((key) => [key, value[key]])));
          await writeFile("trusted-exporter-payload/producer-context.json", canonical({
            repository: "fastest4u/SPX",
            environment: "staging",
            workflow: ".github/workflows/trusted-staging-protected-evidence.yml",
            workflowSha: process.env.WORKFLOW_SHA,
            workflowFileSha256: process.env.WORKFLOW_FILE_SHA256,
          }), { flag: "wx", mode: 0o400 });
          NODE
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf trusted-exporter.tar -C trusted-exporter-payload .
          OPERATION_ID="staging-protected-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "operation_id=${OPERATION_ID}" >> "${GITHUB_OUTPUT}"
          echo "payload_sha256=$(sha256sum trusted-exporter.tar | cut -d' ' -f1)" >> "${GITHUB_OUTPUT}"

      - name: Configure pinned staging SSH host identity
        shell: bash
        env:
          SPX_KNOWN_HOSTS: ${{ secrets.SPX_KNOWN_HOSTS }}
          SPX_SSH_KEY: ${{ secrets.SPX_SSH_KEY }}
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_KNOWN_HOSTS_SHA256: ${{ vars.SPX_KNOWN_HOSTS_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${SPX_KNOWN_HOSTS}"
          test -n "${SPX_SSH_KEY}"
          [[ "${SPX_KNOWN_HOSTS_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${SPX_HOST}" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "${SPX_PORT}" =~ ^[0-9]{1,5}$ ]]
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SPX_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${SPX_SSH_KEY}" > ~/.ssh/spx_staging_evidence_key
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/spx_staging_evidence_key
          test "$(sha256sum ~/.ssh/known_hosts | cut -d' ' -f1)" = "${SPX_KNOWN_HOSTS_SHA256}"
          LOOKUP="${SPX_HOST}"
          if [ "${SPX_PORT}" != 22 ]; then LOOKUP="[${SPX_HOST}]:${SPX_PORT}"; fi
          ssh-keygen -F "${LOOKUP}" -f ~/.ssh/known_hosts >/dev/null

      - name: Upload trusted exporter payload only
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
          OPERATION_ID: ${{ steps.payload.outputs.operation_id }}
        run: |
          set -euo pipefail
          [[ "${SPX_HOST}" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "${SPX_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${SPX_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]
          scp -q -P "${SPX_PORT}" -i ~/.ssh/spx_staging_evidence_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            trusted-exporter.tar "${SPX_USER}@${SPX_HOST}:/tmp/${OPERATION_ID}.tar"

      - name: Execute trusted exporter against fixed staging roots
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
          OPERATION_ID: ${{ steps.payload.outputs.operation_id }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          ssh -p "${SPX_PORT}" -i ~/.ssh/spx_staging_evidence_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SPX_USER}@${SPX_HOST}" bash -s -- "${OPERATION_ID}" "${PAYLOAD_SHA256}" <<'REMOTE'
          set -eEuo pipefail
          umask 077
          OPERATION_ID="$1"
          PAYLOAD_SHA256="$2"
          [[ "${OPERATION_ID}" =~ ^staging-protected-evidence-[0-9]+-[0-9]+$ ]]
          [[ "${PAYLOAD_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          test "$(id -u)" -eq 0
          PAYLOAD="/tmp/${OPERATION_ID}.tar"
          test -f "${PAYLOAD}"
          test "$(sha256sum "${PAYLOAD}" | cut -d' ' -f1)" = "${PAYLOAD_SHA256}"
          tar -tf "${PAYLOAD}" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const path of readFileSync(0, "utf8").split(/\r?\n/).filter(Boolean)) {
              if (path.startsWith("/") || path.split("/").some((part) => part === "..")) throw new Error("unsafe payload path");
            }
          '
          ROOT="$(mktemp -d "/tmp/${OPERATION_ID}.XXXXXX")"
          CONTEXT=/var/lib/spx-staging-rollout/protected-evidence-producer-context.json
          cleanup() {
            rm -f -- "${CONTEXT}" "${PAYLOAD}"
            rm -rf -- "${ROOT}"
          }
          trap cleanup EXIT
          tar -xf "${PAYLOAD}" -C "${ROOT}" --no-same-owner --no-same-permissions
          test -z "$(find "${ROOT}" -type l -print -quit)"
          test -f "${ROOT}/scripts/staging-protected-evidence-export.mjs"
          test -f /var/lib/spx-staging-rollout/verified-release-binding.json
          test -f /var/lib/spx-staging-rollout/actions.jsonl
          for directory in \
            /var/lib/spx-staging-rollout/evidence/gates/ \
            /var/lib/spx-staging-rollout/task9-evidence/ \
            /var/lib/spx-staging-rollout/evidence/worker-staging/ \
            /var/lib/spx-staging-rollout/evidence/phase3-staging/ \
            /var/lib/spx-staging-rollout/evidence/phase4-staging/ \
            /var/lib/spx-staging-rollout/evidence/phase4-n-minus-one-staging/; do
            test -d "${directory}"
          done
          test ! -e "${CONTEXT}"
          install -m 0400 "${ROOT}/producer-context.json" "${CONTEXT}"
          /usr/bin/node "${ROOT}/scripts/staging-protected-evidence-export.mjs"
          test -f /var/lib/spx-staging-rollout/evidence/staging-protected-evidence.json
          test "$(stat -c %a /var/lib/spx-staging-rollout/evidence/staging-protected-evidence.json)" = 400
          REMOTE

      - name: Copy only the fixed protected evidence output
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 protected-output
          scp -q -P "${SPX_PORT}" -i ~/.ssh/spx_staging_evidence_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SPX_USER}@${SPX_HOST}:/var/lib/spx-staging-rollout/evidence/staging-protected-evidence.json" \
            protected-output/staging-protected-evidence.json
          chmod 0400 protected-output/staging-protected-evidence.json

      - name: Validate exact one-file protected output and provenance
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_SHA256: ${{ steps.trusted.outputs.workflow_file_sha256 }}
        run: |
          set -euo pipefail
          test "$(find protected-output -maxdepth 1 -type f | wc -l)" -eq 1
          test -z "$(find protected-output -mindepth 1 ! -type f -print -quit)"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const bytes = await readFile("protected-output/staging-protected-evidence.json", "utf8");
          const value = JSON.parse(bytes);
          const canonical = (input) => Array.isArray(input) ? input.map(canonical) : input && typeof input === "object" ? Object.fromEntries(Object.keys(input).sort().map((key) => [key, canonical(input[key])])) : input;
          if (bytes !== JSON.stringify(canonical(value))) throw new Error("protected evidence is not canonical JSON");
          if (value.candidateSha !== process.env.CANDIDATE_SHA || value.guardClosed !== true) throw new Error("protected evidence release mismatch");
          const producer = value.producer;
          if (producer?.repository !== "fastest4u/SPX" || producer.environment !== "staging" || producer.workflow !== ".github/workflows/trusted-staging-protected-evidence.yml" || producer.workflowSha !== process.env.WORKFLOW_SHA || producer.workflowFileSha256 !== process.env.WORKFLOW_FILE_SHA256) throw new Error("protected evidence producer mismatch");
          NODE

      - name: Attest protected staging evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: protected-output/staging-protected-evidence.json

      - name: Upload exact protected staging evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spx-staging-protected-evidence-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: protected-output/staging-protected-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
