name: A3 Deploy (protected candidate)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target (staging or production)
        required: true
        type: string
      release_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      target_descriptor_artifact_id:
        description: Protected signed target-descriptor artifact ID
        required: true
        type: string
      team2_target_descriptor_artifact_id:
        description: Protected signed TEAM 2 target-descriptor artifact ID (production only)
        required: false
        default: ""
        type: string
      backup_evidence_artifact_id:
        description: Production backup evidence artifact ID (production only)
        required: false
        default: ""
        type: string
      backup_evidence_run_id:
        description: Production backup evidence workflow run ID (production only)
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  deploy-primary:
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # STAGE-C-PIN: immutable reviewed cutover producer snapshot.
    uses: fastest4u/SPX/.github/workflows/trusted-deploy.yml@4d5a3e5ce1e17f33e076cbf3b2a32a25c979d121
    with:
      target: ${{ inputs.target }}
      release_artifact_id: ${{ inputs.release_artifact_id }}
      target_descriptor_artifact_id: ${{ inputs.target_descriptor_artifact_id }}
      backup_evidence_artifact_id: ${{ inputs.backup_evidence_artifact_id }}
      backup_evidence_run_id: ${{ inputs.backup_evidence_run_id }}
    secrets:
      SPX_HOST: ${{ secrets.SPX_HOST }}
      SPX_PORT: ${{ secrets.SPX_PORT }}
      SPX_USER: ${{ secrets.SPX_USER }}
      SPX_KNOWN_HOSTS: ${{ secrets.SPX_KNOWN_HOSTS }}
      SPX_SSH_KEY: ${{ secrets.SPX_SSH_KEY }}
      SPX_PRODUCTION_CANDIDATE_IDENTITY_APPROVAL_B64: ${{ secrets.SPX_PRODUCTION_CANDIDATE_IDENTITY_APPROVAL_B64 }}
      SPX_STAGING_ACTION_CAPABILITY_BUNDLE_B64: ${{ secrets.SPX_STAGING_ACTION_CAPABILITY_BUNDLE_B64 }}

  deploy-team2:
    needs: deploy-primary
    if: inputs.target == 'production'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # STAGE-C-PIN: immutable reviewed cutover producer snapshot.
    uses: fastest4u/SPX/.github/workflows/trusted-team2-deploy.yml@4d5a3e5ce1e17f33e076cbf3b2a32a25c979d121
    with:
      release_artifact_id: ${{ inputs.release_artifact_id }}
      target_descriptor_artifact_id: ${{ inputs.team2_target_descriptor_artifact_id }}
    secrets:
      SPX_TEAM2_HOST: ${{ secrets.SPX_TEAM2_HOST }}
      SPX_TEAM2_PORT: ${{ secrets.SPX_TEAM2_PORT }}
      SPX_TEAM2_USER: ${{ secrets.SPX_TEAM2_USER }}
      SPX_TEAM2_SSH_KEY: ${{ secrets.SPX_TEAM2_SSH_KEY }}
