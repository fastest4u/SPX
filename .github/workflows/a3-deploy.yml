name: A3 Deploy (protected candidate)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected deployment target (staging or production)
        required: true
        type: string
      release_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      target_descriptor_artifact_id:
        description: Protected signed target-descriptor artifact ID
        required: true
        type: string
      team2_target_descriptor_artifact_id:
        description: Protected signed TEAM 2 target-descriptor artifact ID (production only)
        required: false
        default: ""
        type: string
      backup_evidence_artifact_id:
        description: Production backup evidence artifact ID (production only)
        required: false
        default: ""
        type: string
      backup_evidence_run_id:
        description: Production backup evidence workflow run ID (production only)
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  deploy-primary:
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # STAGE-C-PIN: immutable reviewed cutover producer snapshot.
    uses: fastest4u/SPX/.github/workflows/trusted-deploy.yml@1f5d7a419ea23e85e2b09888572063be0798169a
    with:
      target: ${{ inputs.target }}
      release_artifact_id: ${{ inputs.release_artifact_id }}
      target_descriptor_artifact_id: ${{ inputs.target_descriptor_artifact_id }}
      backup_evidence_artifact_id: ${{ inputs.backup_evidence_artifact_id }}
      backup_evidence_run_id: ${{ inputs.backup_evidence_run_id }}

  deploy-team2:
    needs: deploy-primary
    if: inputs.target == 'production'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # STAGE-C-PIN: immutable reviewed cutover producer snapshot.
    uses: fastest4u/SPX/.github/workflows/trusted-team2-deploy.yml@1f5d7a419ea23e85e2b09888572063be0798169a
    with:
      release_artifact_id: ${{ inputs.release_artifact_id }}
      target_descriptor_artifact_id: ${{ inputs.team2_target_descriptor_artifact_id }}
