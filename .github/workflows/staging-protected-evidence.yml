name: Export protected staging evidence

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable release source SHA
        required: true
        type: string
      release_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      release_run_id:
        description: Immutable release workflow run ID
        required: true
        type: string
      staging_target_artifact_id:
        description: Attested staging target descriptor artifact ID
        required: true
        type: string
      staging_target_run_id:
        description: Staging target descriptor workflow run ID
        required: true
        type: string
      staging_approval_artifact_id:
        description: Signed staging approval artifact ID
        required: true
        type: string
      staging_approval_run_id:
        description: Staging approval workflow run ID
        required: true
        type: string
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release source SHA
        required: true
        type: string
      release_artifact_id:
        description: Immutable release artifact ID
        required: true
        type: string
      release_run_id:
        description: Immutable release workflow run ID
        required: true
        type: string
      staging_target_artifact_id:
        description: Attested staging target descriptor artifact ID
        required: true
        type: string
      staging_target_run_id:
        description: Staging target descriptor workflow run ID
        required: true
        type: string
      staging_approval_artifact_id:
        description: Signed staging approval artifact ID
        required: true
        type: string
      staging_approval_run_id:
        description: Staging approval workflow run ID
        required: true
        type: string

permissions: {}

jobs:
  export-protected-evidence:
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    # STAGE-C-PIN: immutable reviewed Stage A producer snapshot.
    uses: fastest4u/SPX/.github/workflows/trusted-staging-protected-evidence.yml@4c0b0cf57481eda1c88ac754fa70500cf0fb59ad
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      release_artifact_id: ${{ inputs.release_artifact_id }}
      release_run_id: ${{ inputs.release_run_id }}
      staging_target_artifact_id: ${{ inputs.staging_target_artifact_id }}
      staging_target_run_id: ${{ inputs.staging_target_run_id }}
      staging_approval_artifact_id: ${{ inputs.staging_approval_artifact_id }}
      staging_approval_run_id: ${{ inputs.staging_approval_run_id }}
