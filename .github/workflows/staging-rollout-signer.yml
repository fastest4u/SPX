name: Sign Staging Rollout Artifacts

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      rollback_sha:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      release_artifact_id:
        required: true
        type: string
      rollback_release_run_id:
        required: true
        type: string
      rollback_release_artifact_id:
        required: true
        type: string
      target_descriptor_run_id:
        required: true
        type: string
      target_descriptor_artifact_id:
        required: true
        type: string
      unsigned_envelope_run_id:
        required: true
        type: string
      unsigned_envelope_artifact_id:
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Verify and stage inert signer inputs
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      prepared_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
      ROLLBACK_RELEASE_RUN_ID: ${{ inputs.rollback_release_run_id }}
      ROLLBACK_RELEASE_ARTIFACT_ID: ${{ inputs.rollback_release_artifact_id }}
      TARGET_DESCRIPTOR_RUN_ID: ${{ inputs.target_descriptor_run_id }}
      TARGET_DESCRIPTOR_ARTIFACT_ID: ${{ inputs.target_descriptor_artifact_id }}
      UNSIGNED_ENVELOPE_RUN_ID: ${{ inputs.unsigned_envelope_run_id }}
      UNSIGNED_ENVELOPE_ARTIFACT_ID: ${{ inputs.unsigned_envelope_artifact_id }}
      TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
      STAGING_SIGNER_WORKFLOW_SHA256: ${{ vars.STAGING_SIGNER_WORKFLOW_SHA256 }}
    steps:
      - name: Validate immutable input selectors
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${RELEASE_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${ROLLBACK_RELEASE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${ROLLBACK_RELEASE_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${TARGET_DESCRIPTOR_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${TARGET_DESCRIPTOR_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${UNSIGNED_ENVELOPE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${UNSIGNED_ENVELOPE_ARTIFACT_ID}" =~ ^[0-9]+$ ]]
          [[ "${STAGING_SIGNER_WORKFLOW_SHA256}" =~ ^[0-9a-f]{64}$ ]]

      - name: Download immutable release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.release_artifact_id }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          digest-mismatch: error
          path: inert-inputs/release

      - name: Download attested A3 target descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.target_descriptor_artifact_id }}
          run-id: ${{ inputs.target_descriptor_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          digest-mismatch: error
          path: inert-inputs/target

      - name: Download immutable rollback release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.rollback_release_artifact_id }}
          run-id: ${{ inputs.rollback_release_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          digest-mismatch: error
          path: inert-inputs/rollback-release

      - name: Download reviewed unsigned envelope
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.unsigned_envelope_artifact_id }}
          run-id: ${{ inputs.unsigned_envelope_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          digest-mismatch: error
          path: inert-inputs/approval

      - name: Verify upstream GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify inert-inputs/release/release-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-artifact.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null
          gh attestation verify inert-inputs/rollback-release/release-manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-artifact.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null
          gh attestation verify inert-inputs/release/operator-bundle.index.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-artifact.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null
          gh attestation verify inert-inputs/release/operator-bundle.tar \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/trusted-release-artifact.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null
          gh attestation verify inert-inputs/target/deployment-target-descriptor.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/deployment-target-descriptor-signer.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null
          gh attestation verify inert-inputs/target/deployment-target-descriptor.attestation-claims.json \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/deployment-target-descriptor-signer.yml" \
            --signer-digest "${TRUSTED_WORKFLOW_SHA}" \
            --deny-self-hosted-runners --format json >/dev/null

      - name: Build bounded canonical prepared input set
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstat, mkdir, readFile, readdir, writeFile } from "node:fs/promises";
          import { basename } from "node:path";

          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          };
          const canonicalJson = (value) => JSON.stringify(canonical(value));
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const inputs = [
            ["release-manifest.json", "inert-inputs/release/release-manifest.json", 1048576, true],
            ["rollback-release-manifest.json", "inert-inputs/rollback-release/release-manifest.json", 1048576, true],
            ["operator-bundle.index.json", "inert-inputs/release/operator-bundle.index.json", 1048576, true],
            ["operator-bundle.tar", "inert-inputs/release/operator-bundle.tar", 67108864, false],
            ["deployment-target-descriptor.json", "inert-inputs/target/deployment-target-descriptor.json", 1048576, true],
            ["deployment-target-descriptor.attestation-claims.json", "inert-inputs/target/deployment-target-descriptor.attestation-claims.json", 1048576, true],
            ["unsigned-envelope.json", "inert-inputs/approval/unsigned-envelope.json", 2097152, true],
          ];
          await mkdir("prepared-inputs", { mode: 0o700 });
          const files = [];
          for (const [name, source, limit, isJson] of inputs) {
            if (name !== basename(name)) throw new Error("prepared filename is invalid");
            const before = await lstat(source, { bigint: true });
            if (!before.isFile() || before.isSymbolicLink() || before.size > BigInt(limit)) {
              throw new Error("prepared source is not a bounded regular file");
            }
            const bytes = await readFile(source);
            const after = await lstat(source, { bigint: true });
            if (before.dev !== after.dev || before.ino !== after.ino || before.size !== after.size || BigInt(bytes.length) !== after.size) {
              throw new Error("prepared source changed during validation");
            }
            if (isJson) {
              const text = new TextDecoder("utf-8", { fatal: true }).decode(bytes);
              const parsed = JSON.parse(text);
              if (text !== canonicalJson(parsed)) throw new Error("prepared JSON is not canonical");
            }
            await writeFile(`prepared-inputs/${name}`, bytes, { flag: "wx", mode: 0o444 });
            files.push({ name, sha256: sha256(bytes), size: bytes.length });
          }
          const index = JSON.parse(await readFile("prepared-inputs/operator-bundle.index.json", "utf8"));
          if (index.schemaVersion !== 1 || index.format !== "ustar" || !Array.isArray(index.files)) {
            throw new Error("operator bundle index is invalid");
          }
          const archive = await readFile("prepared-inputs/operator-bundle.tar");
          const parseOctal = (buffer, offset, length) => {
            const raw = buffer.subarray(offset, offset + length).toString("ascii").replace(/\0.*$/, "").trim();
            if (!/^[0-7]+$/.test(raw)) throw new Error("operator bundle tar numeric field is invalid");
            return Number.parseInt(raw, 8);
          };
          const tarEntries = new Map();
          let offset = 0;
          while (offset + 512 <= archive.length) {
            const header = archive.subarray(offset, offset + 512);
            if (header.every((byte) => byte === 0)) break;
            const checksumHeader = Buffer.from(header);
            const storedChecksum = parseOctal(header, 148, 8);
            checksumHeader.fill(0x20, 148, 156);
            if (checksumHeader.reduce((sum, byte) => sum + byte, 0) !== storedChecksum) throw new Error("operator bundle tar header checksum mismatch");
            const name = header.subarray(0, 100).toString("utf8").replace(/\0.*$/, "");
            const prefix = header.subarray(345, 500).toString("utf8").replace(/\0.*$/, "");
            const path = prefix ? `${prefix}/${name}` : name;
            if (!path || path.startsWith("/") || path.includes("\\") || path.split("/").some((part) => !part || part === "." || part === "..") || tarEntries.has(path)) {
              throw new Error("operator bundle tar path is invalid");
            }
            const size = parseOctal(header, 124, 12);
            const start = offset + 512;
            const end = start + size;
            if (end > archive.length) throw new Error("operator bundle tar is truncated");
            tarEntries.set(path, Buffer.from(archive.subarray(start, end)));
            offset = start + Math.ceil(size / 512) * 512;
          }
          if (offset + 1024 > archive.length || !archive.subarray(offset).every((byte) => byte === 0)) throw new Error("operator bundle tar trailer is invalid");
          const indexedPaths = index.files.map((entry) => entry.path).sort();
          const expectedTarPaths = [...indexedPaths, "operator-bundle-index.json"].sort();
          if (canonicalJson([...tarEntries.keys()].sort()) !== canonicalJson(expectedTarPaths)) throw new Error("operator bundle tar file set is not exact");
          for (const entry of index.files) {
            const bytes = tarEntries.get(entry.path);
            if (!bytes || bytes.length !== entry.size || sha256(bytes) !== entry.sha256 || entry.mode !== "0644") throw new Error("operator bundle tar entry does not match index");
          }
          if (!tarEntries.get("operator-bundle-index.json")?.equals(await readFile("prepared-inputs/operator-bundle.index.json"))) throw new Error("operator bundle detached index mismatch");
          const signerEntries = index.files.filter(
            (entry) => entry?.path === ".github/workflows/staging-rollout-signer.yml",
          );
          if (signerEntries.length !== 1 || signerEntries[0].sha256 !== process.env.STAGING_SIGNER_WORKFLOW_SHA256) {
            throw new Error("operator index does not bind the pinned signer workflow");
          }
          const envelope = JSON.parse(await readFile("prepared-inputs/unsigned-envelope.json", "utf8"));
          if (envelope.release?.candidateSha !== process.env.CANDIDATE_SHA) {
            throw new Error("unsigned envelope candidate mismatch");
          }
          if (envelope.release?.rollbackSha !== process.env.ROLLBACK_SHA) {
            throw new Error("unsigned envelope rollback mismatch");
          }
          const candidateManifestBytes = await readFile(
            "prepared-inputs/release-manifest.json",
          );
          const candidateManifest = JSON.parse(candidateManifestBytes.toString("utf8"));
          const rollbackManifest = JSON.parse(
            await readFile("prepared-inputs/rollback-release-manifest.json", "utf8"),
          );
          if (
            candidateManifest.sourceSha !== process.env.CANDIDATE_SHA ||
            candidateManifest.imageId !== envelope.release?.candidateImageDigest ||
            sha256(candidateManifestBytes) !== envelope.release?.releaseManifestSha256 ||
            rollbackManifest.sourceSha !== process.env.ROLLBACK_SHA ||
            rollbackManifest.imageId !== envelope.release?.rollbackImageDigest ||
            sha256(await readFile("prepared-inputs/rollback-release-manifest.json")) !==
              envelope.release?.rollbackReleaseManifestSha256
          ) {
            throw new Error("candidate or rollback release artifact identity mismatch");
          }
          const currentSchema = candidateManifest.schema?.max;
          const rollbackByName = new Map(
            rollbackManifest.migrations?.map((migration) => [migration.name, migration.sha256]),
          );
          if (
            !Number.isSafeInteger(currentSchema) ||
            !Number.isSafeInteger(rollbackManifest.schema?.min) ||
            !Number.isSafeInteger(rollbackManifest.schema?.max) ||
            currentSchema < rollbackManifest.schema.min ||
            currentSchema > rollbackManifest.schema.max ||
            !candidateManifest.migrations?.every(
              (migration) => rollbackByName.get(migration.name) === migration.sha256,
            )
          ) {
            throw new Error("rollback release migration coverage is incompatible");
          }
          const manifest = {
            schemaVersion: 1,
            candidateSha: process.env.CANDIDATE_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            signerWorkflowSha256: process.env.STAGING_SIGNER_WORKFLOW_SHA256,
            files: files.sort((left, right) => left.name.localeCompare(right.name)),
          };
          await writeFile("prepared-inputs/prepared-manifest.json", canonicalJson(manifest), {
            flag: "wx",
            mode: 0o444,
          });
          const actual = (await readdir("prepared-inputs")).sort();
          if (actual.length !== inputs.length + 1) throw new Error("prepared input set is not exact");
          NODE

      - name: Upload immutable prepared signer inputs
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-signer-prepared-${{ github.run_id }}-${{ github.run_attempt }}
          path: prepared-inputs/
          if-no-files-found: error
          retention-days: 1

  signer:
    name: Protected staging signer
    needs: prepare
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: spx-staging-a3
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: write
      id-token: write
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      TRUSTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
      EXPECTED_WORKFLOW_SHA: ${{ vars.SPX_TRUSTED_STAGING_SIGNER_SHA }}
      STAGING_KMS_SIGNER_URL: ${{ vars.STAGING_KMS_SIGNER_URL }}
      STAGING_SIGNING_KEY_ID: ${{ vars.STAGING_SIGNING_KEY_ID }}
      STAGING_SIGNER_WORKFLOW_SHA256: ${{ vars.STAGING_SIGNER_WORKFLOW_SHA256 }}
    steps:
      - name: Verify immutable protected signer identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "${TRUSTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${TRUSTED_WORKFLOW_SHA}" = "${EXPECTED_WORKFLOW_SHA}"

      - name: Download exact prepared artifact from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.prepare.outputs.prepared_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          merge-multiple: true
          digest-mismatch: error
          path: prepared-inputs

      - name: Revalidate exact prepared bytes without candidate code
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { lstat, readFile, readdir } from "node:fs/promises";

          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          };
          const manifestBytes = await readFile("prepared-inputs/prepared-manifest.json");
          const manifestText = new TextDecoder("utf-8", { fatal: true }).decode(manifestBytes);
          const manifest = JSON.parse(manifestText);
          if (manifestText !== JSON.stringify(canonical(manifest))) throw new Error("prepared manifest is not canonical");
          if (manifest.schemaVersion !== 1 || manifest.candidateSha !== process.env.CANDIDATE_SHA || manifest.rollbackSha !== process.env.ROLLBACK_SHA || manifest.signerWorkflowSha256 !== process.env.STAGING_SIGNER_WORKFLOW_SHA256) {
            throw new Error("prepared manifest binding is invalid");
          }
          const expected = new Set(["prepared-manifest.json"]);
          for (const entry of manifest.files) {
            expected.add(entry.name);
            const stat = await lstat(`prepared-inputs/${entry.name}`, { bigint: true });
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size !== BigInt(entry.size)) throw new Error("prepared artifact identity is invalid");
            const bytes = await readFile(`prepared-inputs/${entry.name}`);
            if (createHash("sha256").update(bytes).digest("hex") !== entry.sha256) throw new Error("prepared artifact digest mismatch");
          }
          const actual = (await readdir("prepared-inputs")).sort();
          if (actual.length !== expected.size || actual.some((name) => !expected.has(name))) throw new Error("prepared artifact set is not exact");
          NODE

      - name: Request exact OIDC identity and sign in KMS
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test -n "${STAGING_KMS_SIGNER_URL}"
          test -n "${STAGING_SIGNING_KEY_ID}"
          oidc_response="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=spx-staging-rollout")"
          oidc_token="$(jq -er '.value' <<<"${oidc_response}")"
          echo "::add-mask::${oidc_token}"
          OIDC_TOKEN="${oidc_token}" node --input-type=module <<'NODE'
          const parts = process.env.OIDC_TOKEN.split(".");
          if (parts.length !== 3) throw new Error("staging signer OIDC token is invalid");
          const claims = JSON.parse(Buffer.from(parts[1], "base64url").toString("utf8"));
          const expectedSubject = `repo:${process.env.GITHUB_REPOSITORY}:environment:staging`;
          const expectedWorkflowRef = `${process.env.GITHUB_REPOSITORY}/.github/workflows/staging-rollout-signer.yml@${process.env.TRUSTED_WORKFLOW_SHA}`;
          if (claims.iss !== "https://token.actions.githubusercontent.com") throw new Error("OIDC issuer mismatch");
          if (claims.aud !== "spx-staging-rollout") throw new Error("OIDC audience mismatch");
          if (claims.repository !== process.env.GITHUB_REPOSITORY) throw new Error("OIDC repository mismatch");
          if (claims.sub !== expectedSubject) throw new Error("OIDC protected environment subject mismatch");
          if (claims.job_workflow_ref !== expectedWorkflowRef) throw new Error("OIDC reusable workflow ref is not the trusted immutable SHA");
          if (claims.job_workflow_sha !== process.env.TRUSTED_WORKFLOW_SHA) throw new Error("OIDC reusable workflow SHA mismatch");
          NODE
          install -m 700 -d signer-output
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            -H "X-SPX-Signing-Key-ID: ${STAGING_SIGNING_KEY_ID}" \
            -H "X-SPX-Workflow-File-SHA256: ${STAGING_SIGNER_WORKFLOW_SHA256}" \
            --data-binary @prepared-inputs/unsigned-envelope.json \
            "${STAGING_KMS_SIGNER_URL}" > signer-response.json
          OIDC_TOKEN="${oidc_token}" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile, writeFile } from "node:fs/promises";

          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === "object") {
              return Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]));
            }
            return value;
          };
          const canonicalJson = (value) => JSON.stringify(canonical(value));
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const responseBytes = await readFile("signer-response.json");
          if (responseBytes.length > 4 * 1024 * 1024) throw new Error("KMS response exceeds size limit");
          const response = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(responseBytes));
          const envelope = response.signedEnvelope;
          const index = response.actionIndex;
          if (!envelope || !index || !Array.isArray(response.actions) || !Array.isArray(index.actions)) throw new Error("KMS response is incomplete");
          const unsignedEnvelope = JSON.parse(
            await readFile("prepared-inputs/unsigned-envelope.json", "utf8"),
          );
          if (!Array.isArray(unsignedEnvelope.actions) || unsignedEnvelope.actions.length === 0) {
            throw new Error("prepared unsigned envelope action set is invalid");
          }
          const expectedActionCount = unsignedEnvelope.actions.length;
          if (
            response.actions.length !== expectedActionCount ||
            index.actions.length !== expectedActionCount
          ) {
            throw new Error("KMS response action set is incomplete");
          }
          const unsignedPayload = (value) => {
            const payload = structuredClone(value);
            delete payload.signedPayloadSha256;
            delete payload.signature;
            return payload;
          };
          if (
            canonicalJson(unsignedPayload(envelope)) !==
            canonicalJson(unsignedPayload(unsignedEnvelope))
          ) {
            throw new Error("signed envelope does not match the prepared request");
          }
          const tokenParts = process.env.OIDC_TOKEN.split(".");
          const claims = JSON.parse(Buffer.from(tokenParts[1], "base64url").toString("utf8"));
          const attestation = (bytes) => ({
            repository: claims.repository,
            workflow: ".github/workflows/staging-rollout-signer.yml",
            workflowSha: claims.job_workflow_sha,
            environment: "staging",
            issuer: claims.iss,
            audience: claims.aud,
            subject: claims.sub,
            subjectDigestSha256: sha256(bytes),
          });
          const writeCanonical = async (name, value) => {
            const bytes = Buffer.from(canonicalJson(value));
            await writeFile(`signer-output/${name}`, bytes, { flag: "wx", mode: 0o444 });
            return bytes;
          };
          const envelopeBytes = await writeCanonical("signed-envelope.json", envelope);
          await writeCanonical("staging-rollout-approval.attestation-claims.json", attestation(envelopeBytes));
          const indexBytes = await writeCanonical("action-index.json", index);
          await writeCanonical("action-index.attestation.json", attestation(indexBytes));
          const actionsById = new Map(response.actions.map((artifact) => [artifact.action?.actionId, artifact]));
          if (actionsById.size !== expectedActionCount) {
            throw new Error("KMS action artifact set contains duplicates");
          }
          const seen = new Set();
          for (const [offset, entry] of index.actions.entries()) {
            const expectedFilename = `${String(offset + 1).padStart(3, "0")}-${entry.actionId}.action.json`;
            if (entry.sequence !== offset + 1 || entry.filename !== expectedFilename || seen.has(entry.actionId)) throw new Error("KMS action index is not exact");
            seen.add(entry.actionId);
            const artifact = actionsById.get(entry.actionId);
            const expectedAction = unsignedEnvelope.actions[offset];
            if (
              !artifact ||
              entry.actionId !== expectedAction?.actionId ||
              entry.scope !== expectedAction?.scope ||
              canonicalJson(artifact.action) !== canonicalJson(expectedAction)
            ) {
              throw new Error("KMS action artifact is not bound to the prepared request and index");
            }
            const actionBytes = await writeCanonical(entry.filename, artifact);
            if (sha256(actionBytes) !== entry.artifactSha256) throw new Error("KMS action artifact digest mismatch");
            await writeCanonical(`${entry.filename}.attestation.json`, attestation(actionBytes));
          }
          NODE
          rm signer-response.json

      - name: Attest only newly signed canonical approval artifacts
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: signer-output/*

      - name: Publish signed approval artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-rollout-approval-${{ inputs.candidate_sha }}
          path: signer-output/
          if-no-files-found: error
          retention-days: 7
