name: Gate 6 OCR one-shot permit

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable release source SHA
        required: true
        type: string
      approval_artifact_id:
        description: Signed Gate 6 approval artifact ID
        required: true
        type: string
      approval_run_id:
        description: Gate 6 approval run ID
        required: true
        type: string
      stage_artifact_id:
        description: Accepted DB transition evidence artifact ID
        required: true
        type: string
      stage_run_id:
        description: Accepted DB transition evidence run ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    # STAGE-C-PIN: immutable reviewed Stage B map/consumer snapshot.
    uses: fastest4u/SPX/.github/workflows/gate6-ocr-permit-signer.yml@1c25f4b3fac398f30c70d26a94c15cefc6f73d15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      approval_artifact_id: ${{ inputs.approval_artifact_id }}
      approval_run_id: ${{ inputs.approval_run_id }}
      stage_artifact_id: ${{ inputs.stage_artifact_id }}
      stage_run_id: ${{ inputs.stage_run_id }}
