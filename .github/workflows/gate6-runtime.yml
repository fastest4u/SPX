name: Gate 6 protected runtime operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed Gate 6 delivery operation
        required: true
        type: choice
        options:
          - admit
          - permit-register-line
          - permit-register-ocr
          - postproof-register
          - abort
          - seal-close
          - release
      candidate_sha:
        description: Immutable release source SHA
        required: true
        type: string
      artifact_id:
        description: Signed operation artifact bundle ID
        required: true
        type: string
      artifact_run_id:
        description: Signed operation artifact run ID
        required: true
        type: string
      final_verifier_artifact_id:
        description: Sealed final-verifier artifact ID (release only)
        required: false
        default: ""
        type: string
      final_verifier_run_id:
        description: Sealed final-verifier workflow run ID (release only)
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deliver:
    # STAGE-C-PIN: immutable reviewed Stage B map/consumer snapshot.
    uses: fastest4u/SPX/.github/workflows/gate6-runtime-executor.yml@1c25f4b3fac398f30c70d26a94c15cefc6f73d15
    permissions:
      actions: read
      attestations: read
      contents: read
    with:
      operation: ${{ inputs.operation }}
      candidate_sha: ${{ inputs.candidate_sha }}
      artifact_id: ${{ inputs.artifact_id }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      final_verifier_artifact_id: ${{ inputs.final_verifier_artifact_id }}
      final_verifier_run_id: ${{ inputs.final_verifier_run_id }}
