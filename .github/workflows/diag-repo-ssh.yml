name: Diagnose repository SSH selector
on:
  workflow_dispatch:
permissions: {}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check repository selectors without exposing values
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_KNOWN_HOSTS: ${{ secrets.SPX_KNOWN_HOSTS }}
          SPX_KNOWN_HOSTS_SHA256: ${{ vars.SPX_KNOWN_HOSTS_SHA256 }}
        run: |
          set -euo pipefail
          printf '%s\n' "${SPX_KNOWN_HOSTS}" > known_hosts
          host_sha=$(printf '%s' "${SPX_HOST}" | sha256sum | cut -d' ' -f1)
          port_sha=$(printf '%s' "${SPX_PORT}" | sha256sum | cut -d' ' -f1)
          known_sha=$(sha256sum known_hosts | cut -d' ' -f1)
          echo "host_sha=${host_sha}"
          echo "port_sha=${port_sha}"
          echo "port_length=${#SPX_PORT}"
          echo "known_sha=${known_sha}"
          echo "known_sha_matches_expected=$([[ \"${known_sha}\" == \"${SPX_KNOWN_HOSTS_SHA256}\" ]] && echo yes || echo no)"
          lookup="${SPX_HOST}"
          if [ "${SPX_PORT}" != 22 ]; then lookup="[${SPX_HOST}]:${SPX_PORT}"; fi
          if ssh-keygen -F "${lookup}" -f known_hosts >/dev/null; then echo lookup=pass; else echo lookup=fail; fi
