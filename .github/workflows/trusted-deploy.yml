              if(previous.schema.max < candidate.schema.max) throw new Error("previous runtime cannot roll back on the candidate schema; install a compatible baseline first");
              const actual=Array.isArray(previousApproval.services)?[...previousApproval.services].sort():[];
              const primarySplit=["line-service","notification-service","ocr-service","web-api","worker-ptwl-split"];
              const formerSameHostSplit=[...primarySplit,"worker-ifn-split"].sort();
              const legacyPrimary=["notifier","worker-ptwl"];
