                if(version > previous.schema.max && version <= candidate.schema.max && !["expand","control-plane"].includes(item?.class)) throw new Error("forward migration is not rollback-safe expansion");
              }
            ' "${CURRENT_PARENT}/release-manifest.json" "${INCOMING}/release/release-manifest.json" "${INCOMING}/operator/deploy/migration-classification.json" "${CURRENT_PARENT}/deployment-context.json" "${CURRENT_PARENT}/production-identity-approval.json"
            ROLLBACK_RUNTIME_COMPATIBLE=true
            if [ "${previous_topology}" != "legacy" ]; then
              (cd "${INCOMING}/operator" && node scripts/production-project-identity.mjs --action=verify \
                --approval="${CURRENT_PARENT}/production-identity-approval.json" \
                --release-manifest="${CURRENT_PARENT}/release-manifest.json")
            fi
          elif [ -n "${CURRENT_RELEASE}" ]; then
            case "${CURRENT_RELEASE}" in /opt/spx-staging/release/*/operator) ;; *) exit 1 ;; esac
          fi
          if [ "${TARGET}" = production ]; then
            RELEASE_PARENT="/root/spx-releases/${SOURCE_SHA}"
          else
            RELEASE_PARENT="${DESCRIPTOR_RELEASE_ROOT}/${SOURCE_SHA}"
          fi
          RELEASE_DIR="${RELEASE_PARENT}/operator"
          ROLLBACK_STATE_ROOT=/var/lib/spx-protected-install/rollback
          if [ "${TARGET}" = staging ]; then ROLLBACK_STATE_ROOT=/var/lib/spx-staging-rollout/rollback; fi
          ROLLBACK_STATE_DIR="${ROLLBACK_STATE_ROOT}/${OPERATION_ID}"
          ROLLBACK_JOURNAL="${ROLLBACK_STATE_DIR}/rollback-journal.json"
          install -d -m 0700 "${ROLLBACK_STATE_ROOT}"
          test ! -e "${ROLLBACK_STATE_DIR}"
          install -d -m 0700 "${ROLLBACK_STATE_DIR}"
          OPERATION_ID="${OPERATION_ID}" ROLLBACK_JOURNAL="${ROLLBACK_JOURNAL}" ROLLBACK_STATE_DIR="${ROLLBACK_STATE_DIR}" CURRENT_RELEASE="${CURRENT_RELEASE}" ROLLBACK_IMAGE="${ROLLBACK_IMAGE}" ROLLBACK_RELEASE_MANIFEST_SHA256="${ROLLBACK_RELEASE_MANIFEST_SHA256}" ROLLBACK_CONFIG_SHA256="${ROLLBACK_CONFIG_SHA256}" ROLLBACK_SERVICE_SET_SHA256="${ROLLBACK_SERVICE_SET_SHA256}" ROLLBACK_RUNTIME_COMPATIBLE="${ROLLBACK_RUNTIME_COMPATIBLE}" node --input-type=module - <<'NODE'
          import { closeSync, constants, fsyncSync, openSync, writeSync } from "node:fs";
          const canonical = (value) => Array.isArray(value) ? value.map(canonical) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])])) : value;
          const value=canonical({
            schemaVersion:2,
            operationId:process.env.OPERATION_ID,
            previousRelease:process.env.CURRENT_RELEASE || null,
            previousImageDigest:process.env.ROLLBACK_IMAGE || null,
            previousReleaseManifestSha256:process.env.ROLLBACK_RELEASE_MANIFEST_SHA256 || null,
            previousConfigSha256:process.env.ROLLBACK_CONFIG_SHA256 || null,
