              docker rm -f "${MIGRATOR_CONTAINER}" >/dev/null 2>&1 || true
              MIGRATOR_CONTAINER=""
            fi
            if [ "${PROTECTED_DEPLOYMENT_COMMITTED}" = true ]; then
              committed_cleanup_status=0
              discard_protected_backups || committed_cleanup_status=$?
              exit "${status}"
            fi
            if [ "${PROTECTED_INSTALL_COMMIT_STARTED}" = true ]; then exit "${status}"; fi
            rollback_status=0
            rollback_runtime || rollback_status=$?
            protected_restore_status=0
            restore_protected_files || protected_restore_status=$?
            if [ "${protected_restore_status}" -ne 0 ]; then
              protected_restore_status=0
              restore_protected_files || protected_restore_status=$?
            fi
            if [ "${rollback_status}" -ne 0 ] || [ "${protected_restore_status}" -ne 0 ]; then exit "${status}"; fi
            if [ "${TARGET}" = production ] && [ "${SLOT_CLAIM_ATTEMPTED}" = true ]; then
              candidate_compose --profile gate6 up -d gate6-db-proxy
              COMPENSATED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
              COMPENSATION_RESULT="$(candidate_compose --profile gate6 run --rm --no-deps \
                -v "${RELEASE_DIR}/scripts:/app/scripts:ro" \
                gate6-control node /app/scripts/protected-install-watchdog.mjs --action=compensate-slot \
                --operation-id="${OPERATION_ID}" --transfer-token-sha256="${TRANSFER_TOKEN_SHA256}" \
                --compensated-at="${COMPENSATED_AT}")"
              COMPENSATION_RESULT="${COMPENSATION_RESULT}" node -e 'const v=JSON.parse(process.env.COMPENSATION_RESULT);if(v.ok!==true||v.status!=="released")process.exit(1)'
              remove_candidate_labeled_containers
            fi
            verify_rollback_runtime
            if [ "${LOCKED}" = true ]; then
              node "${INCOMING}/operator/scripts/production-mutation-host-lock.mjs" --action=terminal \
                --operation-id="${OPERATION_ID}" --release-sha256="${RELEASE_MANIFEST_SHA256}" \
                --target-sha256="${TARGET_SHA256}" --postcondition=rolled-back \
                --postcondition-sha256="${ROLLBACK_EVIDENCE_SHA256}"
            fi
            exit "${status}"
          }
          trap on_error ERR

          INVENTORY_ROOT="${INCOMING}/inventory"
          COMPOSE_INVENTORY="${INVENTORY_ROOT}/compose.json"
          install -d -m 0700 "${INVENTORY_ROOT}"
          INVENTORY_FACTS="${INVENTORY_ROOT}/container-inventory.ndjson"
          ISOLATION_FACTS="${INVENTORY_ROOT}/container-isolation.ndjson"
          GRANT_PREFLIGHT_FACTS="${INVENTORY_ROOT}/grant-preflight.ndjson"
          REPLAY_PREFLIGHT_FACTS="${INVENTORY_ROOT}/replay-preflight.ndjson"
          LIVE_SERVICE_FACTS="${INVENTORY_ROOT}/live-services.tsv"
          for facts in \
            "${INVENTORY_FACTS}" "${ISOLATION_FACTS}" "${GRANT_PREFLIGHT_FACTS}" \
            "${REPLAY_PREFLIGHT_FACTS}" "${LIVE_SERVICE_FACTS}"; do
            : > "${facts}"
            chmod 0600 "${facts}"
          done
          candidate_compose --profile "*" config --format json > "${COMPOSE_INVENTORY}"
          chmod 0400 "${COMPOSE_INVENTORY}"
          verify_isolation_result() {
            local expected_service="$1"
            local isolation_json="$2"
            local evidence_kind="${3:-isolation}"
            EXPECTED_SERVICE="${expected_service}" ISOLATION_JSON="${isolation_json}" node --input-type=module -e '
              const isolation = JSON.parse(process.env.ISOLATION_JSON ?? "");
              if (
                isolation.ok !== true ||
                isolation.service !== process.env.EXPECTED_SERVICE ||
                !Array.isArray(isolation.failureCodes) ||
                isolation.failureCodes.length !== 0
              ) process.exit(1);
            '
            if [ "${evidence_kind}" = isolation ]; then
              printf '%s\t%s\n' "${expected_service}" "$(printf '%s' "${isolation_json}" | base64 -w0)" \
                >> "${ISOLATION_FACTS}"
            else
              test "${evidence_kind}" = inventory
            fi
          }
          verify_host_inventory() {
            local service="$1"
            local container="$2"
            local inventory_json
            [[ "${container}" =~ ^[0-9a-f]{12,64}$ ]]
            inventory_json="$(node "${INCOMING}/operator/scripts/container-inventory-check.mjs" \
              --service="${service}" \
              --project="${COMPOSE_PROJECT}" \
              --compose-json="${COMPOSE_INVENTORY}" \
              --policy="${INCOMING}/operator/deploy/runtime-isolation-policy.json" \
              --container-id="${container}")"
            verify_isolation_result "${service}" "${inventory_json}" inventory
            printf '%s\t%s\n' "${service}" "$(printf '%s' "${inventory_json}" | base64 -w0)" \
              >> "${INVENTORY_FACTS}"
          }
          if [ "${TARGET}" = production ]; then
            GATE6_CAPABILITY_CONFIG=/var/lib/spx-gate6/gate6-control-db.json
            GATE6_CAPABILITY_PASSWORD=/var/lib/spx-gate6/secrets/gate6-control-db-password
            GATE6_CAPABILITY_CA=/var/lib/spx-gate6/config/db-ca.pem
            WATCHDOG_PARENT=/var/lib/spx-protected-install/watchdogs
            WATCHDOG_ROOT="${WATCHDOG_PARENT}/${SOURCE_SHA}"
            WATCHDOG_UNIT="spx-protected-install-watchdog@${SOURCE_SHA}.service"
            WATCHDOG_UNIT_FILE="/etc/systemd/system/${WATCHDOG_UNIT}"
            PREVIOUS_WATCHDOG_UNIT=""
            WATCHDOG_FILES="scripts/protected-install-watchdog.mjs scripts/production-mutation-host-lock.mjs scripts/lib/mysql-connection-config.mjs scripts/lib/file-backed-secret.mjs scripts/lib/safe-file.mjs deploy/systemd/spx-protected-install-watchdog@.service"
            verify_watchdog_file() {
              local relative_path="$1"
              local expected_sha
              expected_sha="$(BUNDLE_INDEX="${INCOMING}/release/operator-bundle.index.json" BUNDLE_PATH="${relative_path}" node -e '
                const index = require(process.env.BUNDLE_INDEX);
                const matches = index.files.filter((entry) => entry.path === process.env.BUNDLE_PATH);
                if (matches.length !== 1 || !/^[0-9a-f]{64}$/.test(matches[0].sha256)) process.exit(1);
                process.stdout.write(matches[0].sha256);
              ')"
              test "$(sha256sum "${RELEASE_DIR}/${relative_path}" | cut -d' ' -f1)" = "${expected_sha}"
            }
            install_protected_watchdog() {
              local relative_path
              install -d -m 0700 "${WATCHDOG_PARENT}"
              for relative_path in ${WATCHDOG_FILES}; do verify_watchdog_file "${relative_path}"; done
              verify_watchdog_file "deploy/systemd/spx-protected-install-watchdog@.service"
              if [ -e "${WATCHDOG_ROOT}" ]; then
                test -d "${WATCHDOG_ROOT}"
                test ! -L "${WATCHDOG_ROOT}"
                test "$(find "${WATCHDOG_ROOT}" -type f | wc -l)" -eq 6
                test -z "$(find "${WATCHDOG_ROOT}" -type l -print -quit)"
                for relative_path in ${WATCHDOG_FILES}; do
                  test -f "${WATCHDOG_ROOT}/${relative_path}"
                  test ! -L "${WATCHDOG_ROOT}/${relative_path}"
                  test "$(stat -c %U "${WATCHDOG_ROOT}/${relative_path}")" = root
                  test "$(stat -c %a "${WATCHDOG_ROOT}/${relative_path}")" = 400
                  test "$(stat -c %h "${WATCHDOG_ROOT}/${relative_path}")" = 1
                  cmp -s "${RELEASE_DIR}/${relative_path}" "${WATCHDOG_ROOT}/${relative_path}"
                done
              else
                test ! -e "${WATCHDOG_ROOT}.new"
                install -d -m 0500 "${WATCHDOG_ROOT}.new/scripts/lib" "${WATCHDOG_ROOT}.new/deploy/systemd"
                for relative_path in ${WATCHDOG_FILES}; do
                  install -D -m 0400 "${RELEASE_DIR}/${relative_path}" "${WATCHDOG_ROOT}.new/${relative_path}"
                  cmp -s "${RELEASE_DIR}/${relative_path}" "${WATCHDOG_ROOT}.new/${relative_path}"
                done
                WATCHDOG_STAGE="${WATCHDOG_ROOT}.new" node --input-type=module - <<'NODE'
                import { closeSync, fsyncSync, openSync, readdirSync, statSync } from "node:fs";
                import { join } from "node:path";
                const visit = (path) => {
                  if (statSync(path).isDirectory()) for (const name of readdirSync(path)) visit(join(path, name));
                  const descriptor = openSync(path, 0);
                  try { fsyncSync(descriptor); } finally { closeSync(descriptor); }
                };
                visit(process.env.WATCHDOG_STAGE);
          NODE
                mv "${WATCHDOG_ROOT}.new" "${WATCHDOG_ROOT}"
                WATCHDOG_PARENT="${WATCHDOG_PARENT}" node --input-type=module -e '
                  import { closeSync, fsyncSync, openSync } from "node:fs";
                  const descriptor = openSync(process.env.WATCHDOG_PARENT, 0);
                  try { fsyncSync(descriptor); } finally { closeSync(descriptor); }
                '
              fi
              node "${WATCHDOG_ROOT}/scripts/protected-install-watchdog.mjs" \
                --action=validate-host-capability --target-descriptor-sha256="${TARGET_SHA256}" >/dev/null
              if [ -e "${WATCHDOG_UNIT_FILE}" ]; then
                test -f "${WATCHDOG_UNIT_FILE}"
                test ! -L "${WATCHDOG_UNIT_FILE}"
                cmp -s "${WATCHDOG_ROOT}/deploy/systemd/spx-protected-install-watchdog@.service" "${WATCHDOG_UNIT_FILE}"
              else
                install -m 0444 "${WATCHDOG_ROOT}/deploy/systemd/spx-protected-install-watchdog@.service" "${WATCHDOG_UNIT_FILE}"
              fi
              systemctl daemon-reload
              systemctl disable --now spx-protected-install-watchdog.service >/dev/null 2>&1 || true
              for unit_link in /etc/systemd/system/multi-user.target.wants/spx-protected-install-watchdog@*.service; do
                [ -e "${unit_link}" ] || continue
                previous_unit="$(basename "${unit_link}")"
                [[ "${previous_unit}" =~ ^spx-protected-install-watchdog@[0-9a-f]{40}\.service$ ]]
                if [ "${previous_unit}" != "${WATCHDOG_UNIT}" ]; then
                  test -z "${PREVIOUS_WATCHDOG_UNIT}"
                  PREVIOUS_WATCHDOG_UNIT="${previous_unit}"
                fi
              done
              systemctl enable "${WATCHDOG_UNIT}"
              systemctl start "${WATCHDOG_UNIT}"
              systemctl is-active --quiet "${WATCHDOG_UNIT}"
              WATCHDOG_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
              if [ -n "${PREVIOUS_WATCHDOG_UNIT}" ]; then systemctl disable --now "${PREVIOUS_WATCHDOG_UNIT}"; fi
            }
            install_protected_watchdog

            INSTALL_EVIDENCE_ROOT=/var/lib/spx-protected-install/evidence
            INSTALL_INTENT_EVIDENCE="${INSTALL_EVIDENCE_ROOT}/${OPERATION_ID}.intent.json"
            install -d -m 0700 "${INSTALL_EVIDENCE_ROOT}"
            EVIDENCE_PATH="${INSTALL_INTENT_EVIDENCE}" EVIDENCE_OPERATION_ID="${OPERATION_ID}" EVIDENCE_RELEASE_SHA="${SOURCE_SHA}" EVIDENCE_TARGET_SHA256="${TARGET_SHA256}" EVIDENCE_BUNDLE_SHA256="${OPERATOR_BUNDLE_SHA256}" EVIDENCE_BACKUP_SHA256="${BACKUP_EVIDENCE_SHA256}" EVIDENCE_RELEASE_MANIFEST="${RELEASE_PARENT}/release-manifest.json" node --input-type=module - <<'NODE'
            import { createHash, randomBytes } from "node:crypto";
            import { closeSync, constants, existsSync, fsyncSync, mkdirSync, openSync, readFileSync, writeSync } from "node:fs";
            import { dirname } from "node:path";
            const canonical = (value) => Array.isArray(value) ? value.map(canonical) : value && typeof value === "object" ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])])) : value;
            const release = JSON.parse(readFileSync(process.env.EVIDENCE_RELEASE_MANIFEST, "utf8"));
            const path = process.env.EVIDENCE_PATH;
            const expected = {
              schemaVersion: 1,
              operationId: process.env.EVIDENCE_OPERATION_ID,
              state: "installing",
              backupEvidenceSha256: process.env.EVIDENCE_BACKUP_SHA256,
              releaseSha: process.env.EVIDENCE_RELEASE_SHA,
              targetDescriptorSha256: process.env.EVIDENCE_TARGET_SHA256,
              operatorBundleSha256: process.env.EVIDENCE_BUNDLE_SHA256,
              installedMigrationSetSha256: release.migrationSetSha256,
              installedSchemaVersion: release.schema.max,
            };
            let evidence;
            if (existsSync(path)) {
              evidence = JSON.parse(readFileSync(path, "utf8"));
              for (const [key, value] of Object.entries(expected)) if (evidence[key] !== value) throw new Error("protected install intent binding mismatch");
            } else {
              const heartbeatAt = new Date().toISOString();
              evidence = canonical({
                ...expected,
                transferTokenSha256: createHash("sha256").update(randomBytes(32)).digest("hex"),
                heartbeatAt,
                expiresAt: new Date(Date.parse(heartbeatAt) + 24 * 60 * 60 * 1000).toISOString(),
              });
              mkdirSync(dirname(path), { recursive: true, mode: 0o700 });
              const descriptor = openSync(path, constants.O_CREAT | constants.O_EXCL | constants.O_WRONLY | (constants.O_NOFOLLOW ?? 0), 0o400);
              try { writeSync(descriptor, `${JSON.stringify(evidence)}\n`); fsyncSync(descriptor); } finally { closeSync(descriptor); }
              const directory = openSync(dirname(path), constants.O_RDONLY);
              try { fsyncSync(directory); } finally { closeSync(directory); }
            }
          NODE
            INSTALL_INTENT_EVIDENCE_SHA256="$(sha256sum "${INSTALL_INTENT_EVIDENCE}" | cut -d' ' -f1)"
            TRANSFER_TOKEN_SHA256="$(node -p 'require(process.argv[1]).transferTokenSha256' "${INSTALL_INTENT_EVIDENCE}")"
            INSTALLED_MIGRATION_SET_SHA256="$(node -p 'require(process.argv[1]).installedMigrationSetSha256' "${INSTALL_INTENT_EVIDENCE}")"
            INSTALLED_SCHEMA_VERSION="$(node -p 'require(process.argv[1]).installedSchemaVersion' "${INSTALL_INTENT_EVIDENCE}")"
            INSTALL_HEARTBEAT_AT="$(node -p 'require(process.argv[1]).heartbeatAt' "${INSTALL_INTENT_EVIDENCE}")"
            INSTALL_EXPIRES_AT="$(node -p 'require(process.argv[1]).expiresAt' "${INSTALL_INTENT_EVIDENCE}")"
            candidate_compose --profile gate6 up -d gate6-db-proxy
          fi
          candidate_compose --profile migration create --force-recreate migrator
          MIGRATOR_CONTAINER="$(candidate_compose --profile migration ps -a -q migrator)"
          verify_host_inventory migrator "${MIGRATOR_CONTAINER}"
          migrator_isolation="$(candidate_compose --profile migration run --rm --no-deps \
            -v "${RELEASE_DIR}/scripts:/tmp/spx-isolation/scripts:ro" \
            -v "${RELEASE_DIR}/deploy:/tmp/spx-isolation/deploy:ro" \
            migrator node /tmp/spx-isolation/scripts/container-isolation-probe.mjs --service=migrator)"
          verify_isolation_result migrator "${migrator_isolation}"
          MIGRATION_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          docker start "${MIGRATOR_CONTAINER}" >/dev/null
          MIGRATOR_STATUS="$(docker wait "${MIGRATOR_CONTAINER}")"
          test "${MIGRATOR_STATUS}" = 0
          MIGRATION_FINISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          MIGRATION_RESULT_JSON="$(docker logs "${MIGRATOR_CONTAINER}" 2>/dev/null)"
          MIGRATION_RESULT_JSON="${MIGRATION_RESULT_JSON}" node -e '
            const value=JSON.parse(process.env.MIGRATION_RESULT_JSON);
            if (JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(["applied","ok","skipped"]) || value.ok !== true || !Array.isArray(value.applied) || !Array.isArray(value.skipped)) process.exit(1);
          '
          MIGRATION_COMPLETED=true
          docker rm "${MIGRATOR_CONTAINER}" >/dev/null
          MIGRATOR_CONTAINER=""
          if [ "${TARGET}" = production ]; then
            SLOT_CLAIM_ATTEMPTED=true
            BOOTSTRAP_SLOT_RESULT="$(candidate_compose --profile gate6 run --rm --no-deps \
              -v "${RELEASE_DIR}/scripts:/app/scripts:ro" \
              gate6-control node /app/scripts/protected-install-watchdog.mjs --action=claim-bootstrap-slot \
              --operation-id="${OPERATION_ID}" --transfer-token-sha256="${TRANSFER_TOKEN_SHA256}" \
              --install-intent-evidence-sha256="${INSTALL_INTENT_EVIDENCE_SHA256}" \
              --release-sha="${SOURCE_SHA}" --target-descriptor-sha256="${TARGET_SHA256}" \
              --operator-bundle-sha256="${OPERATOR_BUNDLE_SHA256}" \
              --installed-migration-set-sha256="${INSTALLED_MIGRATION_SET_SHA256}" \
              --installed-schema-version="${INSTALLED_SCHEMA_VERSION}" \
              --heartbeat-at="${INSTALL_HEARTBEAT_AT}" --expires-at="${INSTALL_EXPIRES_AT}")"
            BOOTSTRAP_SLOT_VERSION="$(SLOT_RESULT="${BOOTSTRAP_SLOT_RESULT}" node -e 'const v=JSON.parse(process.env.SLOT_RESULT); if(v.ok!==true||v.status!=="installing"||!Number.isSafeInteger(v.slotVersion))process.exit(1); process.stdout.write(String(v.slotVersion))')"
            node "${RELEASE_DIR}/scripts/production-mutation-host-lock.mjs" --action=install-bootstrap \
              --operation-id="${OPERATION_ID}" --release-sha256="${RELEASE_MANIFEST_SHA256}" \
              --target-sha256="${TARGET_SHA256}" --source-sha="${SOURCE_SHA}" \
              --transfer-token-sha256="${TRANSFER_TOKEN_SHA256}" \
              --install-intent-evidence-sha256="${INSTALL_INTENT_EVIDENCE_SHA256}" \
              --operator-bundle-sha256="${OPERATOR_BUNDLE_SHA256}" \
              --installed-migration-set-sha256="${INSTALLED_MIGRATION_SET_SHA256}" \
              --installed-schema-version="${INSTALLED_SCHEMA_VERSION}" --slot-version="${BOOTSTRAP_SLOT_VERSION}" \
              --heartbeat-at="${INSTALL_HEARTBEAT_AT}" --expires-at="${INSTALL_EXPIRES_AT}"
          fi
          install -d -m 0700 "$(dirname "${ACTIVE_PROJECTION}")"
          ln -sfn "${RELEASE_DIR}" "${ACTIVE_PROJECTION}.next"
          mv -Tf "${ACTIVE_PROJECTION}.next" "${ACTIVE_PROJECTION}"
          verify_replay_preflight_result() {
            REPLAY_PREFLIGHT_JSON="$1" node --input-type=module -e '
              const result = JSON.parse(process.env.REPLAY_PREFLIGHT_JSON ?? "");
              const keys = Object.keys(result).sort();
              if (
                JSON.stringify(keys) !== JSON.stringify(["failureCodes", "mode", "ok"]) ||
                result.ok !== true ||
                result.mode !== "live" ||
                !Array.isArray(result.failureCodes) ||
                result.failureCodes.length !== 0
              ) process.exit(1);
            '
          }
          run_replay_preflight() {
            local service="$1"
            local replay_preflight_json
            replay_preflight_json="$(candidate_compose --profile "*" run --rm --no-deps \
              -v "${INCOMING}/operator/scripts:/app/scripts:ro" \
              "${service}" node /app/scripts/internal-replay-grant-preflight.mjs 2>/dev/null)"
            verify_replay_preflight_result "${replay_preflight_json}"
            printf '%s\t%s\n' "${service}" "$(printf '%s' "${replay_preflight_json}" | base64 -w0)" \
              >> "${REPLAY_PREFLIGHT_FACTS}"
          }
          read_account_host() {
            local service="$1"
            node -e '
              const context = require(process.argv[1]);
              const host = context.databaseAccountHosts?.[process.argv[2]];
              if (
                typeof host !== "string" ||
                host.length < 1 ||
                host.length > 255 ||
                host !== host.trim() ||
                /[%_]/.test(host) ||
                !/^[0-9A-Za-z.:-]+(?:\/[0-9A-Za-z.:-]+)?$/.test(host)
              ) process.exit(1);
              process.stdout.write(host);
            ' "${CONTEXT}" "${service}"
          }
          verify_grant_preflight_result() {
            EXPECTED_ROLE="$1" GRANT_PREFLIGHT_JSON="$2" node --input-type=module -e '
              const result = JSON.parse(process.env.GRANT_PREFLIGHT_JSON ?? "");
              const keys = Object.keys(result).sort();
              if (
                JSON.stringify(keys) !== JSON.stringify(["failureCodes", "mode", "ok", "role"]) ||
                result.ok !== true ||
                result.mode !== "live" ||
                result.role !== process.env.EXPECTED_ROLE ||
                !Array.isArray(result.failureCodes) ||
                result.failureCodes.length !== 0
              ) process.exit(1);
            '
          }
          run_grant_preflight() {
            local service="$1"
            local expected_account_host
            local grant_preflight_json
            expected_account_host="$(read_account_host "${service}")"
            grant_preflight_json="$(candidate_compose --profile "*" run --rm --no-deps \
              -v "${INCOMING}/operator/scripts:/app/scripts:ro" \
              -v "${INCOMING}/operator/deploy:/app/deploy:ro" \
              "${service}" node /app/scripts/db-grants-check.mjs \
                --role="${service}" \
                --contract=/app/deploy/db-grants.json \
                --expected-account-host="${expected_account_host}" 2>/dev/null)"
            verify_grant_preflight_result "${service}" "${grant_preflight_json}"
            printf '%s\t%s\n' "${service}" "$(printf '%s' "${grant_preflight_json}" | base64 -w0)" \
              >> "${GRANT_PREFLIGHT_FACTS}"
          }
          if [ "${TARGET}" = production ]; then
            node "${RELEASE_DIR}/scripts/production-topology.mjs" check "${RELEASE_DIR}/deploy/production-topology.json" >/dev/null
            SERVICES="$(node "${RELEASE_DIR}/scripts/production-topology.mjs" services "${RELEASE_DIR}/deploy/production-topology.json" --unit=primary --format=shell)"
            GRANT_PREFLIGHT_SERVICES="migrator web-api notification-service line-service worker-ptwl-split"
          else
            SERVICES="web-api notification-service line-service ocr-service worker-ifn-split worker-ptwl-split"
            GRANT_PREFLIGHT_SERVICES="migrator web-api notification-service line-service worker-ifn-split worker-ptwl-split"
          fi
          REPLAY_PREFLIGHT_SERVICES="web-api notification-service line-service"
          if [[ " ${SERVICES} " == *" realtime-service "* ]]; then
            GRANT_PREFLIGHT_SERVICES="${GRANT_PREFLIGHT_SERVICES} realtime-service"
            REPLAY_PREFLIGHT_SERVICES="${REPLAY_PREFLIGHT_SERVICES} realtime-service"
          fi
          for service in ${GRANT_PREFLIGHT_SERVICES}; do
            run_grant_preflight "${service}"
          done
          for service in ${REPLAY_PREFLIGHT_SERVICES}; do
            run_replay_preflight "${service}"
          done
          candidate_compose stop notifier worker-ifn worker-ptwl worker-ifn-split
          candidate_compose --profile split up -d ${SERVICES}
          for service in ${SERVICES}; do
            container="$(candidate_compose ps -a -q "${service}")"
            verify_host_inventory "${service}" "${container}"
          done
          deadline=$(( $(date +%s) + 180 ))
          while :; do
            ready=true
            for service in ${SERVICES}; do
              container="$(candidate_compose ps -q "${service}")"
              if [ -z "${container}" ] || [ "$(docker inspect --format '{{.State.Running}}' "${container}")" != true ]; then ready=false; break; fi
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container}")"
              if [ "${health}" != healthy ] && [ "${health}" != none ]; then ready=false; break; fi
            done
            if [ "${ready}" = true ] && curl -fsS --connect-timeout 5 --max-time 10 "http://127.0.0.1:${READINESS_PORT}/ready" >/dev/null; then break; fi
            test "$(date +%s)" -lt "${deadline}"
            sleep 5
          done
          READINESS_VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"
          for service in ${SERVICES}; do
            container="$(candidate_compose ps -q "${service}")"
            probe_root="/tmp/spx-isolation-${OPERATION_ID}"
            docker exec --user 0 "${container}" mkdir -p "${probe_root}/scripts" "${probe_root}/deploy"
            docker exec --user 0 "${container}" chmod 0555 "${probe_root}" "${probe_root}/scripts" "${probe_root}/deploy"
            docker cp "${RELEASE_DIR}/scripts/container-isolation-probe.mjs" "${container}:${probe_root}/scripts/container-isolation-probe.mjs"
            docker cp "${RELEASE_DIR}/deploy/runtime-isolation-policy.json" "${container}:${probe_root}/deploy/runtime-isolation-policy.json"
            isolation_json="$(docker exec --user node "${container}" node "${probe_root}/scripts/container-isolation-probe.mjs" --service="${service}")"
            verify_isolation_result "${service}" "${isolation_json}"
          done
          if [ "${TARGET}" = production ]; then
            if ! node -e 'const a=require(process.argv[1]); if(a.externalManagedApproval) process.exit(0); process.exit(1);' "${RELEASE_PARENT}/production-identity-approval.json" 2>/dev/null; then
              (cd "${RELEASE_DIR}" && node scripts/production-project-identity.mjs --action=verify \
                --approval="${RELEASE_PARENT}/production-identity-approval.json" \
                --release-manifest="${RELEASE_PARENT}/release-manifest.json")
            fi

            PHASE34_STOPPED_SERVICES="poller-ifn-phase3 auto-accept-ifn-phase3 poller-ptwl-phase3 auto-accept-ptwl-phase3 gate6-control gate6-task9-controller gate6-monitor-probe"
            for stopped_service in ${PHASE34_STOPPED_SERVICES}; do
              test -z "$(candidate_compose --profile "*" ps -q "${stopped_service}")"
            done
            : > "${LIVE_SERVICE_FACTS}"
            for service in ${SERVICES}; do
              container="$(candidate_compose ps -q "${service}")"
              [[ "${container}" =~ ^[0-9a-f]{12,64}$ ]]
              printf '%s|%s|' "${service}" "${container}" >> "${LIVE_SERVICE_FACTS}"
              docker inspect --format '{{index .Config.Labels "com.spx.environment"}}|{{index .Config.Labels "com.spx.release-sha"}}|{{index .Config.Labels "com.spx.target-descriptor-sha256"}}|{{index .Config.Labels "com.spx.operator-bundle-sha256"}}|{{index .Config.Labels "com.spx.staging-run-id"}}|{{.Image}}|{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container}" \
                >> "${LIVE_SERVICE_FACTS}"
            done
            chmod 0400 "${LIVE_SERVICE_FACTS}"
            LIVE_HEALTH_SHA256="$(sha256sum "${LIVE_SERVICE_FACTS}" | cut -d' ' -f1)"
            systemctl is-active --quiet "${WATCHDOG_UNIT}"
            test "$(readlink -f "${ACTIVE_PROJECTION}")" = "${RELEASE_DIR}"
            install_trusted_producer_file \
              "${INCOMING}/backup-verification.json" \
              "${PROTECTED_INSTALL_CONTEXT_ROOT}/verified-backup-evidence-summary.json"
            PROTECTED_INSTALL_FACT_ROOT="/var/lib/spx-protected-install/facts/${OPERATION_ID}"
            PROTECTED_INSTALL_CONTEXT_ROOT="${PROTECTED_INSTALL_CONTEXT_ROOT}" \
            PROTECTED_INSTALL_BASE_CONTEXT_FILES="${PROTECTED_INSTALL_BASE_CONTEXT_FILES}" \
            PROTECTED_INSTALL_PRODUCER_ROOT="${PROTECTED_INSTALL_PRODUCER_ROOT}" \
            PROTECTED_INSTALL_FACT_ROOT="${PROTECTED_INSTALL_FACT_ROOT}" \
            OPERATION_ID="${OPERATION_ID}" SOURCE_SHA="${SOURCE_SHA}" IMAGE_ID="${IMAGE_ID}" \
            RELEASE_MANIFEST_SHA256="${RELEASE_MANIFEST_SHA256}" TARGET_SHA256="${TARGET_SHA256}" \
            OPERATOR_BUNDLE_SHA256="${OPERATOR_BUNDLE_SHA256}" \
            RELEASE_MANIFEST_PATH="${RELEASE_PARENT}/release-manifest.json" \
            ROLLBACK_MANIFEST_PATH="${CURRENT_PARENT}/release-manifest.json" \
            ROLLBACK_JOURNAL="${ROLLBACK_JOURNAL}" ROLLBACK_IMAGE="${ROLLBACK_IMAGE}" \
            ROLLBACK_RELEASE_MANIFEST_SHA256="${ROLLBACK_RELEASE_MANIFEST_SHA256}" \
            ROLLBACK_RUNTIME_COMPATIBLE="${ROLLBACK_RUNTIME_COMPATIBLE}" \
            TARGET_DESCRIPTOR_PATH="${RELEASE_PARENT}/deployment-target-descriptor.json" \
            BACKUP_SUMMARY_PATH="${PROTECTED_INSTALL_CONTEXT_ROOT}/verified-backup-evidence-summary.json" \
            PRODUCER_CONTEXT_PATH="${PROTECTED_INSTALL_PRODUCER_CONTEXT}" \
            MIGRATION_RESULT_JSON="${MIGRATION_RESULT_JSON}" \
            MIGRATION_STARTED_AT="${MIGRATION_STARTED_AT}" MIGRATION_FINISHED_AT="${MIGRATION_FINISHED_AT}" \
            GRANT_PREFLIGHT_FACTS="${GRANT_PREFLIGHT_FACTS}" \
            REPLAY_PREFLIGHT_FACTS="${REPLAY_PREFLIGHT_FACTS}" \
            INVENTORY_FACTS="${INVENTORY_FACTS}" ISOLATION_FACTS="${ISOLATION_FACTS}" \
            LIVE_SERVICE_FACTS="${LIVE_SERVICE_FACTS}" \
            BOOTSTRAP_SLOT_RESULT="${BOOTSTRAP_SLOT_RESULT}" \
            WATCHDOG_STARTED_AT="${WATCHDOG_STARTED_AT}" WATCHDOG_UNIT="${WATCHDOG_UNIT}" \
            READINESS_VERIFIED_AT="${READINESS_VERIFIED_AT}" \
            ACTIVE_PROJECTION="${ACTIVE_PROJECTION}" RELEASE_DIR="${RELEASE_DIR}" \
            EVIDENCE_SIGNING_KEY_ID="${EVIDENCE_SIGNING_KEY_ID}" \
              /usr/bin/node --input-type=module - <<'NODE'
            import { createHash } from "node:crypto";
            import {
              closeSync,
              constants,
              existsSync,
              fstatSync,
              fsyncSync,
              lstatSync,
              mkdirSync,
              openSync,
              readFileSync,
              realpathSync,
              readdirSync,
              statSync,
              writeSync,
            } from "node:fs";
            import { dirname, join } from "node:path";
            import { pathToFileURL } from "node:url";

            const SHA256 = /^[0-9a-f]{64}$/;
            const COMMIT = /^[0-9a-f]{40}$/;
            const IMAGE = /^sha256:[0-9a-f]{64}$/;
            const BASELINE_SERVICES = [
              "line-service",
              "notification-service",
              "ocr-service",
              "web-api",
              "worker-ptwl-split",
            ];
            const producerRoot = process.env.PROTECTED_INSTALL_PRODUCER_ROOT;
            const contextRoot = process.env.PROTECTED_INSTALL_CONTEXT_ROOT;
            const factRoot = process.env.PROTECTED_INSTALL_FACT_ROOT;
            const { canonicalJson, sha256Canonical } = await import(
              pathToFileURL(join(producerRoot, "scripts/lib/evidence-artifact.mjs")).href
            );
            const { previewPreparedGate6SlotWithMysqlClient } = await import(
              pathToFileURL(join(producerRoot, "scripts/protected-install-watchdog.mjs")).href
            );
            const {
              previewProductionInstallHostLockCommit,
              readProductionMutationLock,
            } = await import(
              pathToFileURL(join(producerRoot, "scripts/production-mutation-host-lock.mjs")).href
            );
            const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
            const timestamp = (value, label) => {
              const milliseconds = Date.parse(value);
              if (!Number.isFinite(milliseconds) || new Date(milliseconds).toISOString() !== value) {
                throw new Error(`${label} is not an exact ISO timestamp`);
              }
              return milliseconds;
            };
            const exactKeys = (value, fields, label) => {
              if (!value || typeof value !== "object" || Array.isArray(value)) throw new Error(`${label} is invalid`);
              if (JSON.stringify(Object.keys(value).sort()) !== JSON.stringify([...fields].sort())) {
                throw new Error(`${label} fields changed`);
              }
              return value;
            };
            const assertPrivateDirectory = (path) => {
              const status = lstatSync(path);
              if (!status.isDirectory() || status.isSymbolicLink() || status.uid !== 0 || (status.mode & 0o777) !== 0o700) {
                throw new Error(`${path} is not a root-private directory`);
              }
            };
            const assertPrivateFile = (path) => {
              const status = lstatSync(path);
              if (
                !status.isFile() ||
                status.isSymbolicLink() ||
                status.uid !== 0 ||
                status.nlink !== 1 ||
                (status.mode & 0o777) !== 0o400 ||
                status.size < 1 ||
                status.size > 512 * 1024
              ) throw new Error(`${path} is not a fixed root-private fact`);
              return status;
            };
            const readCanonical = (path) => {
              assertPrivateFile(path);
              const bytes = readFileSync(path);
              const value = JSON.parse(bytes.toString("utf8"));
              if (!bytes.equals(Buffer.from(canonicalJson(value)))) throw new Error(`${path} is not canonical JSON`);
              assertPrivateFile(path);
              return value;
            };
            const writeCanonical = (path, value) => {
              const bytes = Buffer.from(canonicalJson(value));
              const descriptor = openSync(
                path,
                constants.O_CREAT | constants.O_EXCL | constants.O_WRONLY | (constants.O_NOFOLLOW ?? 0),
                0o400,
              );
              try { writeSync(descriptor, bytes); fsyncSync(descriptor); } finally { closeSync(descriptor); }
              assertPrivateFile(path);
              if (!readFileSync(path).equals(bytes)) throw new Error(`${path} changed after durable creation`);
              return hash(bytes);
            };
            const syncDirectory = (path) => {
              const descriptor = openSync(path, constants.O_RDONLY);
              try { fsyncSync(descriptor); } finally { closeSync(descriptor); }
            };
            const trustedFileSha256 = (path, options) => {
              const before = lstatSync(path, { bigint: true });
              const mode = Number(before.mode & 0o777n);
              if (
                !before.isFile() || before.isSymbolicLink() || before.uid !== 0n || before.nlink !== 1n ||
                before.size < 1n || before.size > BigInt(options.maximumBytes) ||
                (options.mode !== undefined ? mode !== options.mode : (mode & 0o022) !== 0) ||
                (options.executable === true && (mode & 0o100) === 0)
              ) throw new Error("fixed KMS file metadata is invalid");
              const descriptor = openSync(path, constants.O_RDONLY | (constants.O_NOFOLLOW ?? 0));
              try {
                const opened = fstatSync(descriptor, { bigint: true });
                const bytes = readFileSync(descriptor);
                const after = fstatSync(descriptor, { bigint: true });
                for (const field of ["dev", "ino", "size", "mtimeNs", "ctimeNs"]) {
                  if (opened[field] !== before[field] || after[field] !== opened[field]) {
                    throw new Error("fixed KMS file changed while hashed");
                  }
                }
                return hash(bytes);
              } finally { closeSync(descriptor); }
            };
            const parseEncodedFacts = (path) =>
              readFileSync(path, "utf8").trim().split("\n").filter(Boolean).map((line) => {
                const [service, encoded, ...extra] = line.split("\t");
                if (!service || !encoded || extra.length !== 0) throw new Error(`${path} fact line is invalid`);
                return { service, result: JSON.parse(Buffer.from(encoded, "base64").toString("utf8")) };
              });

            assertPrivateDirectory(contextRoot);
            const initialContextNames = readdirSync(contextRoot).sort();
            if (JSON.stringify(initialContextNames) !== JSON.stringify([
              "verified-backup-evidence-summary.json",
              "verified-producer-context.json",
            ])) throw new Error("protected install context was not empty for this trusted producer operation");
            const backupEvidence = readCanonical(process.env.BACKUP_SUMMARY_PATH);
            const producer = readCanonical(process.env.PRODUCER_CONTEXT_PATH);
            exactKeys(producer, ["repository", "environment", "workflow", "workflowSha", "workflowFileSha256"], "producer context");

            const releaseDocument = JSON.parse(readFileSync(process.env.RELEASE_MANIFEST_PATH, "utf8"));
            const rollbackDocument = JSON.parse(readFileSync(process.env.ROLLBACK_MANIFEST_PATH, "utf8"));
            const targetDocument = JSON.parse(readFileSync(process.env.TARGET_DESCRIPTOR_PATH, "utf8"));
            const rollbackJournal = JSON.parse(readFileSync(process.env.ROLLBACK_JOURNAL, "utf8"));
            const release = {
              sourceSha: releaseDocument.sourceSha,
              imageId: releaseDocument.imageId,
              operatorBundleSha256: releaseDocument.operatorBundleSha256,
              schema: releaseDocument.schema,
              migrations: releaseDocument.migrations,
              migrationSetSha256: releaseDocument.migrationSetSha256,
            };
            const rollback = {
              releaseManifestSha256: process.env.ROLLBACK_RELEASE_MANIFEST_SHA256,
              sourceSha: rollbackDocument.sourceSha,
              imageId: rollbackDocument.imageId,
              schema: rollbackDocument.schema,
            };
            if (
              !COMMIT.test(release.sourceSha) || !IMAGE.test(release.imageId) ||
              release.sourceSha !== process.env.SOURCE_SHA || release.imageId !== process.env.IMAGE_ID ||
              !COMMIT.test(rollback.sourceSha) || !IMAGE.test(rollback.imageId) ||
              rollback.imageId !== process.env.ROLLBACK_IMAGE ||
              hash(readFileSync(process.env.RELEASE_MANIFEST_PATH)) !== process.env.RELEASE_MANIFEST_SHA256 ||
              hash(readFileSync(process.env.ROLLBACK_MANIFEST_PATH)) !== rollback.releaseManifestSha256 ||
              rollbackJournal.previousReleaseManifestSha256 !== rollback.releaseManifestSha256 ||
              rollbackJournal.previousImageDigest !== rollback.imageId ||
              rollbackJournal.runtimeRollbackCompatible !== true ||
              process.env.ROLLBACK_RUNTIME_COMPATIBLE !== "true" ||
              release.schema.max < rollback.schema.min || release.schema.max > rollback.schema.max
            ) throw new Error("verified rollback release is not ready for this install");
            const descriptor = targetDocument.descriptor;
            const target = {
              descriptorSha256: process.env.TARGET_SHA256,
              releaseManifestSha256: process.env.RELEASE_MANIFEST_SHA256,
              releaseSourceSha: release.sourceSha,
              imageId: release.imageId,
              operatorBundleSha256: process.env.OPERATOR_BUNDLE_SHA256,
              databaseFingerprint: `sha256:${descriptor.database.tlsFingerprintSha256}`,
            };
            if (!IMAGE.test(target.databaseFingerprint) || descriptor.releaseEnvironment !== "production") {
              throw new Error("verified production target is invalid");
            }

            const migrationResult = exactKeys(
              JSON.parse(process.env.MIGRATION_RESULT_JSON),
              ["ok", "applied", "skipped"],
              "migration result",
            );
            if (migrationResult.ok !== true || !Array.isArray(migrationResult.applied) || !Array.isArray(migrationResult.skipped)) {
              throw new Error("migration result did not prove success");
            }
            const releasedNames = release.migrations.map((item) => item.name);
            const observedNames = [...migrationResult.applied, ...migrationResult.skipped];
            if (
              new Set(observedNames).size !== observedNames.length ||
              JSON.stringify([...observedNames].sort()) !== JSON.stringify([...releasedNames].sort())
            ) throw new Error("migration result does not cover the exact released set");
            const classifiedPendingAlters = migrationResult.applied.filter((name) => {
              const sql = readFileSync(join(dirname(process.env.RELEASE_MANIFEST_PATH), "operator/migrations", name), "utf8")
                .replace(/^\s*--.*$/gm, "");
              return sql.split(";").some((statement) => /^\s*ALTER\s+TABLE\b/i.test(statement));
            });
            if (classifiedPendingAlters.length !== 0) {
              throw new Error("verified online DDL receipts are unavailable for applied ALTER migrations");
            }
            const beforeSchema = migrationResult.skipped.length === 0
              ? 0
              : Math.max(...migrationResult.skipped.map((name) => Number.parseInt(name.slice(0, 3), 10)));
            if (!Number.isSafeInteger(beforeSchema) || beforeSchema > release.schema.max) {
              throw new Error("observed pre-install schema is invalid");
            }
            const migrationReceipt = {
              ok: true,
              beforeSchema,
              afterSchema: release.schema.max,
              installedMigrationSetSha256: release.migrationSetSha256,
              pendingReleasedMigrationCount: 0,
              backupRestoreEvidenceSha256: backupEvidence.evidenceSha256,
              rollbackSchemaCompatible: true,
              checksumSetExact: true,
            };
            const onlineDdl = { classifiedPendingAlters: [], onlineDdlReceipts: [] };

            const identity = {
              operationId: process.env.OPERATION_ID,
              releaseSha: release.sourceSha,
              targetDescriptorSha256: target.descriptorSha256,
              operatorBundleSha256: release.operatorBundleSha256,
            };
            const databaseIdentity = {
              ...identity,
              installedMigrationSetSha256: release.migrationSetSha256,
              installedSchemaVersion: release.schema.max,
            };
            const databasePreview = previewPreparedGate6SlotWithMysqlClient(databaseIdentity);
            const hostPreview = await previewProductionInstallHostLockCommit({ identity });
            for (const [label, preview] of [["database", databasePreview], ["host", hostPreview]]) {
              exactKeys(preview, ["current", "next"], `${label} preview`);
              if (
                preview.current.operationId !== process.env.OPERATION_ID ||
                preview.current.state !== "installing" ||
                !Number.isSafeInteger(preview.current.version) || preview.current.version < 1 ||
                preview.next.operationId !== process.env.OPERATION_ID ||
                preview.next.state !== "installed-awaiting-gate6" ||
                preview.next.version !== preview.current.version + 1
              ) throw new Error(`${label} preview is not the actual installing state`);
            }
            const lock = await readProductionMutationLock();
            if (
              lock.operationId !== process.env.OPERATION_ID || lock.state !== "installing" ||
              lock.revision !== hostPreview.current.version || lock.installBootstrap === null ||
              lock.installBootstrap.releaseSha !== release.sourceSha ||
              lock.installBootstrap.targetDescriptorSha256 !== target.descriptorSha256 ||
              lock.installBootstrap.operatorBundleSha256 !== release.operatorBundleSha256
            ) throw new Error("host-lock installing fact changed before evidence preparation");

            const liveServices = readFileSync(process.env.LIVE_SERVICE_FACTS, "utf8").trim().split("\n").map((line) => {
              const fields = line.split("|");
              if (fields.length !== 10) throw new Error("live service fact is invalid");
              const [service, containerId, environment, releaseSha, targetSha256, bundleSha256, stagingRunId, imageId, state, health] = fields;
              return { service, containerId, environment, releaseSha, targetSha256, bundleSha256, stagingRunId, imageId, state, health };
            });
            if (JSON.stringify(liveServices.map((item) => item.service)) !== JSON.stringify(BASELINE_SERVICES)) {
              throw new Error("live service facts do not cover the ordered baseline");
            }
            for (const item of liveServices) {
              if (
                !/^[0-9a-f]{12,64}$/.test(item.containerId) || item.environment !== "production" ||
                item.releaseSha !== release.sourceSha || item.targetSha256 !== target.descriptorSha256 ||
                item.bundleSha256 !== release.operatorBundleSha256 || item.stagingRunId !== "not-staging" ||
                item.imageId !== release.imageId || item.state !== "running" ||
                !["healthy", "none"].includes(item.health)
              ) throw new Error(`live service identity failed for ${item.service}`);
            }
            const inventoryFacts = parseEncodedFacts(process.env.INVENTORY_FACTS);
            const isolationFacts = parseEncodedFacts(process.env.ISOLATION_FACTS);
            for (const service of BASELINE_SERVICES) {
              for (const [label, facts] of [["inventory", inventoryFacts], ["isolation", isolationFacts]]) {
                const matches = facts.filter((item) => item.service === service);
                if (matches.length !== 1 || matches[0].result.ok !== true) {
                  throw new Error(`${label} fact is incomplete for ${service}`);
                }
              }
            }
            const grantFacts = parseEncodedFacts(process.env.GRANT_PREFLIGHT_FACTS);
            const replayFacts = parseEncodedFacts(process.env.REPLAY_PREFLIGHT_FACTS);
            if (grantFacts.length < BASELINE_SERVICES.length || replayFacts.length < 3) {
              throw new Error("grant or replay preflight facts are incomplete");
            }
            for (const item of [...grantFacts, ...replayFacts]) {
              if (item.result.ok !== true || item.result.mode !== "live" || item.result.failureCodes?.length !== 0) {
                throw new Error(`grant fact failed for ${item.service}`);
              }
            }
            const bootstrapResult = JSON.parse(process.env.BOOTSTRAP_SLOT_RESULT);
            if (
              bootstrapResult.ok !== true || bootstrapResult.status !== "installing" ||
              !Number.isSafeInteger(bootstrapResult.slotVersion) ||
              bootstrapResult.slotVersion > databasePreview.current.version
            ) throw new Error("bootstrap principal fact is invalid");

            mkdirSync(dirname(factRoot), { recursive: true, mode: 0o700 });
            assertPrivateDirectory(dirname(factRoot));
            if (existsSync(factRoot)) throw new Error("protected install fact root already exists");
            mkdirSync(factRoot, { mode: 0o700 });
            assertPrivateDirectory(factRoot);
            writeCanonical(join(factRoot, "migration-run.json"), {
              operationId: process.env.OPERATION_ID,
              startedAt: process.env.MIGRATION_STARTED_AT,
              finishedAt: process.env.MIGRATION_FINISHED_AT,
              result: migrationResult,
              releasedMigrations: release.migrations,
            });
            const positiveGrantProofSha256 = writeCanonical(join(factRoot, "positive-grants.json"), {
              kind: "required-grants-present",
              operationId: process.env.OPERATION_ID,
              checks: grantFacts,
            });
            const forbiddenGrantProofSha256 = writeCanonical(join(factRoot, "forbidden-grants.json"), {
              kind: "forbidden-grants-absent",
              operationId: process.env.OPERATION_ID,
              checks: grantFacts,
              replayChecks: replayFacts,
            });
            const bootstrapPrincipalEvidenceSha256 = writeCanonical(join(factRoot, "bootstrap-principals.json"), {
              kind: "bootstrap-principals-bound",
              operationId: process.env.OPERATION_ID,
              slotClaim: bootstrapResult,
              databaseState: databasePreview.current,
              hostState: hostPreview.current,
            });
            const grantEvidence = {
              operationId: process.env.OPERATION_ID,
              positiveGrantProofSha256,
              forbiddenGrantProofSha256,
              bootstrapPrincipalEvidenceSha256,
            };

            const serviceFacts = BASELINE_SERVICES.map((service) => ({
              identity: liveServices.find((item) => item.service === service),
              inventory: inventoryFacts.find((item) => item.service === service).result,
              isolation: isolationFacts.find((item) => item.service === service).result,
            }));
            writeCanonical(join(factRoot, "service-activation.json"), {
              operationId: process.env.OPERATION_ID,
              phase34ProfilesStopped: true,
              readinessVerifiedAt: process.env.READINESS_VERIFIED_AT,
              services: serviceFacts,
            });
            const serviceJournalCore = {
              operationId: process.env.OPERATION_ID,
              phase34ProfilesStopped: true,
              entries: BASELINE_SERVICES.map((service) => ({
                service,
                activated: true,
                identityVerified: true,
                ready: true,
                watermarkPassed: true,
              })),
            };
            const serviceActivationJournal = {
              ...serviceJournalCore,
              journalSha256: sha256Canonical(serviceJournalCore),
            };
            const healthEvidenceSha256 = writeCanonical(join(factRoot, "health.json"), {
              operationId: process.env.OPERATION_ID,
              readinessVerifiedAt: process.env.READINESS_VERIFIED_AT,
              services: liveServices.map(({ service, containerId, imageId, state, health }) => ({ service, containerId, imageId, state, health })),
            });
            const watermarkEvidenceSha256 = writeCanonical(join(factRoot, "watermark.json"), {
              operationId: process.env.OPERATION_ID,
              activeProjection: realpathSync(process.env.ACTIVE_PROJECTION),
              services: liveServices.map(({ service, releaseSha, targetSha256, bundleSha256 }) => ({ service, releaseSha, targetSha256, bundleSha256 })),
            });
            const healthEvidence = {
              operationId: process.env.OPERATION_ID,
              candidateSha: release.sourceSha,
              imageDigest: release.imageId,
              activatedServices: BASELINE_SERVICES,
              evidenceSha256: healthEvidenceSha256,
              passed: true,
            };
            const watermarkEvidence = {
              operationId: process.env.OPERATION_ID,
              activatedServices: BASELINE_SERVICES,
              evidenceSha256: watermarkEvidenceSha256,
              passed: true,
            };

            const startedAt = process.env.WATCHDOG_STARTED_AT;
            const firstMutationAt = process.env.MIGRATION_STARTED_AT;
            const lastHeartbeatAt = lock.lease.heartbeatAt;
            const finalizedAt = new Date().toISOString();
            if (
              timestamp(startedAt, "watchdog start") >= timestamp(firstMutationAt, "first mutation") ||
              timestamp(firstMutationAt, "first mutation") > timestamp(lastHeartbeatAt, "watchdog heartbeat") ||
              timestamp(lastHeartbeatAt, "watchdog heartbeat") > timestamp(finalizedAt, "watchdog finalization")
            ) throw new Error("watchdog did not continuously cover the protected install");
            writeCanonical(join(factRoot, "watchdog.json"), {
              operationId: process.env.OPERATION_ID,
              unit: process.env.WATCHDOG_UNIT,
              startedAt,
              firstMutationAt,
              lastHeartbeatAt,
              finalizedAt,
              observedState: lock.state,
            });
            const watchdogCore = {
              operationId: process.env.OPERATION_ID,
              startedAt,
              firstMutationAt,
              lastHeartbeatAt,
              finalizedAt,
              startedBeforeMutation: true,
              continuous: true,
              terminal: true,
            };
            const watchdogJournal = { ...watchdogCore, journalSha256: sha256Canonical(watchdogCore) };
            const rollbackReadinessSha256 = writeCanonical(join(factRoot, "rollback-readiness.json"), {
              operationId: process.env.OPERATION_ID,
              rollbackJournalSha256: hash(readFileSync(process.env.ROLLBACK_JOURNAL)),
              rollbackReleaseManifestSha256: rollback.releaseManifestSha256,
              rollbackSha: rollback.sourceSha,
              rollbackImageDigest: rollback.imageId,
              rollbackSchema: rollback.schema,
              candidateSchema: release.schema,
            });
            const rollbackReadiness = {
              operationId: process.env.OPERATION_ID,
              rollbackSha: rollback.sourceSha,
              rollbackImageDigest: rollback.imageId,
              evidenceSha256: rollbackReadinessSha256,
              schemaCompatible: true,
              ready: true,
            };
            syncDirectory(factRoot);

            const finalHeartbeatMs = Math.max(Date.now(), timestamp(finalizedAt, "watchdog finalization")) + 1_000;
            if (timestamp(lock.lease.expiresAt, "current watchdog expiry") < finalHeartbeatMs) {
              throw new Error("watchdog lease cannot cover protected evidence preparation");
            }
            const finalHeartbeat = new Date(finalHeartbeatMs).toISOString();
            const finalExpiry = new Date(finalHeartbeatMs + 30 * 60 * 1_000).toISOString();
            const installed = {
              candidateSha: release.sourceSha,
              imageDigest: release.imageId,
              targetDescriptorSha256: target.descriptorSha256,
              operatorBundleSha256: release.operatorBundleSha256,
              databaseFingerprint: target.databaseFingerprint,
              schemaVersion: release.schema.max,
              migrationSetSha256: release.migrationSetSha256,
            };
            const installContext = {
              schemaVersion: 1,
              releaseEnvironment: "production",
              operationId: process.env.OPERATION_ID,
              releaseManifestSha256: process.env.RELEASE_MANIFEST_SHA256,
              release,
              rollback,
              target,
              installed,
              hostLock: { ...identity, state: "installing", version: hostPreview.current.version },
              databaseSlot: { ...databaseIdentity, state: "installing", version: databasePreview.current.version },
              finalLease: { heartbeatAt: finalHeartbeat, expiresAt: finalExpiry },
              issuedAt: finalHeartbeat,
            };
            const signingContext = {
              schemaVersion: 1,
              kmsExecutableSha256: trustedFileSha256("/usr/local/libexec/spx-kms-envelope", {
                maximumBytes: 512 * 1024 * 1024,
                executable: true,
              }),
              kmsCapabilitySha256: trustedFileSha256("/run/credentials/spx-protected-install-evidence-kms.json", {
                maximumBytes: 512 * 1024,
                mode: 0o400,
              }),
              evidenceSigningKeyId: process.env.EVIDENCE_SIGNING_KEY_ID,
              signedAt: finalHeartbeat,
            };
            if (!SHA256.test(signingContext.kmsExecutableSha256) || !SHA256.test(signingContext.kmsCapabilitySha256)) {
              throw new Error("fixed KMS facts are invalid");
            }
            const contexts = new Map([
              ["verified-install-context.json", installContext],
              ["verified-migration-receipt.json", migrationReceipt],
              ["verified-online-ddl-receipts.json", onlineDdl],
              ["verified-grant-evidence.json", grantEvidence],
              ["verified-service-activation-journal.json", serviceActivationJournal],
              ["verified-watchdog-journal.json", watchdogJournal],
              ["verified-health-evidence.json", healthEvidence],
              ["verified-watermark-evidence.json", watermarkEvidence],
              ["verified-rollback-readiness.json", rollbackReadiness],
              ["verified-signing-context.json", signingContext],
            ]);
            for (const [name, value] of contexts) writeCanonical(join(contextRoot, name), value);
            syncDirectory(contextRoot);
            const expectedContextNames = process.env.PROTECTED_INSTALL_BASE_CONTEXT_FILES.split(" ").sort();
            if (JSON.stringify(readdirSync(contextRoot).sort()) !== JSON.stringify(expectedContextNames)) {
              throw new Error("protected install base context file set is incomplete");
            }
            for (const name of expectedContextNames) assertPrivateFile(join(contextRoot, name));
            NODE
            PROTECTED_INSTALL_COMMIT_STARTED=true
            /usr/bin/node "${PROTECTED_INSTALL_PRODUCER_ROOT}/scripts/protected-install-evidence.mjs"
            PROTECTED_INSTALL_EXPORT_ROOT=/var/lib/spx-protected-install/export
            test "$(find "${PROTECTED_INSTALL_EXPORT_ROOT}" -maxdepth 1 -type f | wc -l)" -eq 2
            test -z "$(find "${PROTECTED_INSTALL_EXPORT_ROOT}" -mindepth 1 ! -type f -print -quit)"
            for output in protected-install-evidence.json protected-install-signature.json; do
              test -f "${PROTECTED_INSTALL_EXPORT_ROOT}/${output}"
              test ! -L "${PROTECTED_INSTALL_EXPORT_ROOT}/${output}"
              test "$(stat -c %u "${PROTECTED_INSTALL_EXPORT_ROOT}/${output}")" -eq 0
              test "$(stat -c %a "${PROTECTED_INSTALL_EXPORT_ROOT}/${output}")" = 400
            done
          fi
          PROTECTED_DEPLOYMENT_COMMITTED=true
          discard_protected_backups
          trap - ERR
          REMOTE

      - name: Retrieve exact protected install evidence exports
        id: protected-install-state
        if: inputs.target == 'production'
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
          OPERATION_ID: ${{ steps.context.outputs.operation_id }}
          PROTECTED_INSTALL_PRODUCER_SHA256: ${{ steps.install-evidence-producer.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 0700 protected-install-output
          for output in protected-install-evidence.json protected-install-signature.json; do
            scp -q -P "${SPX_PORT}" -i ~/.ssh/spx_deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "${SPX_USER}@${SPX_HOST}:/var/lib/spx-protected-install/export/${output}" \
              "protected-install-output/${output}"
            chmod 0400 "protected-install-output/${output}"
          done
          test "$(find protected-install-output -maxdepth 1 -type f | wc -l)" -eq 2
          test -z "$(find protected-install-output -mindepth 1 ! -type f -print -quit)"
          SOURCE_SHA="$(node -p 'require(process.argv[1]).sourceSha' ./verified/release/release-manifest.json)"
          TARGET_SHA256="$(sha256sum verified/target/deployment-target-descriptor.json | cut -d' ' -f1)"
          OPERATOR_BUNDLE_SHA256="$(node -p 'require(process.argv[1]).operatorBundleSha256' ./verified/release/release-manifest.json)"
          INSTALLED_MIGRATION_SET_SHA256="$(node -p 'require(process.argv[1]).migrationSetSha256' ./verified/release/release-manifest.json)"
          INSTALLED_SCHEMA_VERSION="$(node -p 'require(process.argv[1]).schema.max' ./verified/release/release-manifest.json)"
          VERIFIER_EXPECTATION_B64="$(
            ssh -p "${SPX_PORT}" -i ~/.ssh/spx_deploy_key \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "${SPX_USER}@${SPX_HOST}" bash -s -- \
                "${OPERATION_ID}" "${SOURCE_SHA}" "${TARGET_SHA256}" \
                "${OPERATOR_BUNDLE_SHA256}" "${INSTALLED_MIGRATION_SET_SHA256}" \
                "${INSTALLED_SCHEMA_VERSION}" "${PROTECTED_INSTALL_PRODUCER_SHA256}" <<'REMOTE'
          set -eEuo pipefail
          umask 077
          test "$(id -u)" -eq 0
          OPERATION_ID="$1"
          SOURCE_SHA="$2"
          TARGET_SHA256="$3"
          OPERATOR_BUNDLE_SHA256="$4"
          INSTALLED_MIGRATION_SET_SHA256="$5"
          INSTALLED_SCHEMA_VERSION="$6"
          PROTECTED_INSTALL_PRODUCER_SHA256="$7"
          [[ "${OPERATION_ID}" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          for digest in \
            "${TARGET_SHA256}" "${OPERATOR_BUNDLE_SHA256}" \
            "${INSTALLED_MIGRATION_SET_SHA256}" "${PROTECTED_INSTALL_PRODUCER_SHA256}"; do
            [[ "${digest}" =~ ^[0-9a-f]{64}$ ]]
          done
          [[ "${INSTALLED_SCHEMA_VERSION}" =~ ^[1-9][0-9]*$ ]]
          PRODUCER_ROOT="/var/lib/spx-protected-install/producers/${PROTECTED_INSTALL_PRODUCER_SHA256}"
          OPERATION_ID="${OPERATION_ID}" SOURCE_SHA="${SOURCE_SHA}" \
          TARGET_SHA256="${TARGET_SHA256}" OPERATOR_BUNDLE_SHA256="${OPERATOR_BUNDLE_SHA256}" \
          INSTALLED_MIGRATION_SET_SHA256="${INSTALLED_MIGRATION_SET_SHA256}" \
          INSTALLED_SCHEMA_VERSION="${INSTALLED_SCHEMA_VERSION}" PRODUCER_ROOT="${PRODUCER_ROOT}" \
            /usr/bin/node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync } from "node:fs";
          import { dirname, join } from "node:path";
          import { pathToFileURL } from "node:url";
          const canonical = (value) => Array.isArray(value)
            ? value.map(canonical)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
              : value;
          const hash = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const secureJson = (path) => {
            const status = lstatSync(path);
            if (!status.isFile() || status.isSymbolicLink() || status.uid !== 0 || status.nlink !== 1 || (status.mode & 0o777) !== 0o400) {
              throw new Error("protected verifier state boundary changed");
            }
            return JSON.parse(readFileSync(path, "utf8"));
          };
          const producerRoot = process.env.PRODUCER_ROOT;
          const { readGate6SlotWithMysqlClient } = await import(
            pathToFileURL(join(producerRoot, "scripts/protected-install-watchdog.mjs")).href
          );
          const { readProductionMutationLock } = await import(
            pathToFileURL(join(producerRoot, "scripts/production-mutation-host-lock.mjs")).href
          );
          const lock = await readProductionMutationLock();
          const slot = readGate6SlotWithMysqlClient(process.env.TARGET_SHA256);
          const installedSchemaVersion = Number(process.env.INSTALLED_SCHEMA_VERSION);
          if (
            lock.operationId !== process.env.OPERATION_ID || lock.state !== "installed-awaiting-gate6" ||
            lock.protectedInstall === null || lock.protectedInstall.releaseSha !== process.env.SOURCE_SHA ||
            lock.protectedInstall.targetDescriptorSha256 !== process.env.TARGET_SHA256 ||
            lock.protectedInstall.operatorBundleSha256 !== process.env.OPERATOR_BUNDLE_SHA256 ||
            slot?.environment !== "production" || slot.owner_type !== "protected-install" ||
            slot.owner_id !== process.env.OPERATION_ID || slot.operation_id !== process.env.OPERATION_ID ||
            slot.state !== "installed-awaiting-gate6" || slot.release_sha !== process.env.SOURCE_SHA ||
            slot.target_descriptor_sha256 !== process.env.TARGET_SHA256 ||
            slot.operator_bundle_sha256 !== process.env.OPERATOR_BUNDLE_SHA256 ||
            slot.installed_migration_set_sha256 !== process.env.INSTALLED_MIGRATION_SET_SHA256 ||
            slot.installed_schema_version !== installedSchemaVersion ||
            slot.protected_install_evidence_sha256 !== lock.protectedInstall.protectedInstallEvidenceSha256
          ) throw new Error("protected verifier host/DB state does not match the installed release");
          const rollbackJournal = secureJson(
            `/var/lib/spx-protected-install/rollback/${process.env.OPERATION_ID}/rollback-journal.json`,
          );
          if (
            typeof rollbackJournal.previousRelease !== "string" ||
            !/^\/root\/spx-releases\/[0-9a-f]{40}\/operator$/.test(rollbackJournal.previousRelease)
          ) throw new Error("protected verifier rollback root is invalid");
          const rollbackManifestPath = join(dirname(rollbackJournal.previousRelease), "release-manifest.json");
          const rollbackManifestBytes = readFileSync(rollbackManifestPath);
          const rollbackManifest = JSON.parse(rollbackManifestBytes.toString("utf8"));
          if (
            hash(rollbackManifestBytes) !== rollbackJournal.previousReleaseManifestSha256 ||
            rollbackManifest.imageId !== rollbackJournal.previousImageDigest ||
            !/^[0-9a-f]{40}$/.test(rollbackManifest.sourceSha ?? "") ||
            !/^sha256:[0-9a-f]{64}$/.test(rollbackManifest.imageId ?? "")
          ) throw new Error("protected verifier rollback identity changed");
          const expectation = canonical({
            rollbackSha: rollbackManifest.sourceSha,
            rollbackImageDigest: rollbackManifest.imageId,
            rollbackReleaseManifestSha256: rollbackJournal.previousReleaseManifestSha256,
            hostLock: {
              operationId: lock.operationId,
              state: lock.state,
              version: lock.revision,
            },
            databaseSlot: {
              operationId: slot.operation_id,
              state: slot.state,
              version: slot.version,
            },
          });
          process.stdout.write(Buffer.from(JSON.stringify(expectation)).toString("base64"));
          NODE
          REMOTE
          )"
          [[ "${VERIFIER_EXPECTATION_B64}" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          echo "verifier_expectation_b64=${VERIFIER_EXPECTATION_B64}" >> "${GITHUB_OUTPUT}"

      - name: Verify exact protected install evidence locally
        if: inputs.target == 'production'
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_SHA256: ${{ vars.SPX_PROTECTED_INSTALL_EVIDENCE_WORKFLOW_FILE_SHA256 }}
          EXPECTED_OPERATION_ID: ${{ steps.context.outputs.operation_id }}
          EXPECTED_STATE_B64: ${{ steps.protected-install-state.outputs.verifier_expectation_b64 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const canonical = (value) =>
            Array.isArray(value)
              ? value.map(canonical)
              : value && typeof value === "object"
                ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, canonical(value[key])]))
                : value;
          const readCanonical = async (path) => {
            const bytes = await readFile(path);
            const value = JSON.parse(bytes.toString("utf8"));
            if (!bytes.equals(Buffer.from(JSON.stringify(canonical(value))))) {
              throw new Error(path + " is not canonical JSON");
            }
            return value;
          };
          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const evidence = await readCanonical(
            "protected-install-output/protected-install-evidence.json",
          );
          const signatureFile = await readCanonical(
            "protected-install-output/protected-install-signature.json",
          );
          const releaseBytes = await readFile("verified/release/release-manifest.json");
          const targetBytes = await readFile(
            "verified/target/deployment-target-descriptor.json",
          );
          const release = JSON.parse(releaseBytes.toString("utf8"));
          const target = JSON.parse(targetBytes.toString("utf8")).descriptor;
          const backupEvidence = JSON.parse(
            await readFile("verified/backup-verification.json", "utf8"),
          );
          const expectedState = JSON.parse(
            Buffer.from(process.env.EXPECTED_STATE_B64, "base64").toString("utf8"),
          );
          const expectedStateKeys = [
            "databaseSlot",
            "hostLock",
            "rollbackImageDigest",
            "rollbackReleaseManifestSha256",
            "rollbackSha",
          ];
          if (
            JSON.stringify(Object.keys(expectedState).sort())
              !== JSON.stringify(expectedStateKeys)
            || JSON.stringify(Object.keys(expectedState.hostLock ?? {}).sort())
              !== JSON.stringify(["operationId", "state", "version"])
            || JSON.stringify(Object.keys(expectedState.databaseSlot ?? {}).sort())
              !== JSON.stringify(["operationId", "state", "version"])
          ) {
            throw new Error("protected install independent verifier expectation is invalid");
          }
          const producer = {
            repository: "fastest4u/SPX",
            environment: "production",
            workflow: ".github/workflows/trusted-deploy.yml",
            workflowSha: process.env.WORKFLOW_SHA,
            workflowFileSha256: process.env.WORKFLOW_FILE_SHA256,
          };
          if (
            evidence.operationId !== process.env.EXPECTED_OPERATION_ID
            || evidence.candidateSha !== release.sourceSha
            || evidence.candidateImageDigest !== release.imageId
            || evidence.releaseManifestSha256 !== sha256(releaseBytes)
            || evidence.productionTargetDescriptorSha256 !== sha256(targetBytes)
            || evidence.releaseOperatorBundleSha256 !== release.operatorBundleSha256
            || evidence.installedOperatorBundleSha256 !== release.operatorBundleSha256
            || evidence.databaseFingerprint !== "sha256:" + target.database.tlsFingerprintSha256
            || evidence.backupRestoreEvidenceSha256 !== backupEvidence.evidenceSha256
            || evidence.pendingReleasedMigrationCount !== 0
          ) {
            throw new Error("protected install evidence does not match verified deployment inputs");
          }
          const modulePath = resolve(
            "trusted-install-evidence/scripts/protected-install-evidence.mjs",
          );
          const { verifyProtectedInstallEvidence } = await import(
            pathToFileURL(modulePath).href
          );
          const result = verifyProtectedInstallEvidence(evidence, {
            operationId: process.env.EXPECTED_OPERATION_ID,
            candidateSha: release.sourceSha,
            candidateImageDigest: release.imageId,
            rollbackSha: expectedState.rollbackSha,
            rollbackImageDigest: expectedState.rollbackImageDigest,
            releaseManifestSha256: sha256(releaseBytes),
            rollbackReleaseManifestSha256: expectedState.rollbackReleaseManifestSha256,
            productionTargetDescriptorSha256: sha256(targetBytes),
            releaseOperatorBundleSha256: release.operatorBundleSha256,
            installedOperatorBundleSha256: release.operatorBundleSha256,
            databaseFingerprint: "sha256:" + target.database.tlsFingerprintSha256,
            backupRestoreEvidenceSha256: backupEvidence.evidenceSha256,
            producer,
            hostLock: expectedState.hostLock,
            databaseSlot: expectedState.databaseSlot,
            signatureFile,
          });
          if (
            result?.ok !== true
            || result.installedSchemaVersion !== release.schema.max
            || result.installedMigrationSetSha256 !== release.migrationSetSha256
          ) {
            throw new Error("protected install evidence semantic verification failed");
          }
          NODE

      - name: Attest protected install evidence
        if: inputs.target == 'production'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: protected-install-output/protected-install-evidence.json

      - name: Attest protected install signature
        if: inputs.target == 'production'
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: protected-install-output/protected-install-signature.json

      - name: Upload protected install evidence artifact
        id: protected-install-artifact
        if: inputs.target == 'production'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: spx-protected-install-evidence-${{ steps.context.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            protected-install-output/protected-install-evidence.json
            protected-install-output/protected-install-signature.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record protected install artifact identity
        if: inputs.target == 'production'
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.protected-install-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.protected-install-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "${ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          printf 'protected_install_artifact_id=%s\nprotected_install_artifact_digest=%s\n' \
            "${ARTIFACT_ID}" "${ARTIFACT_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove protected install exports after successful upload
        if: inputs.target == 'production'
        shell: bash
        env:
          SPX_HOST: ${{ secrets.SPX_HOST }}
          SPX_PORT: ${{ secrets.SPX_PORT }}
          SPX_USER: ${{ secrets.SPX_USER }}
        run: |
          set -euo pipefail
          ssh -p "${SPX_PORT}" -i ~/.ssh/spx_deploy_key \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SPX_USER}@${SPX_HOST}" bash -s <<'REMOTE'
          set -eEuo pipefail
          test "$(id -u)" -eq 0
          /usr/bin/node --input-type=module <<'NODE'
          import { constants } from "node:fs";
          import { lstat, open, readdir, unlink } from "node:fs/promises";
          import { join } from "node:path";
          const exportRoot = "/var/lib/spx-protected-install/export";
          const names = [
            "protected-install-evidence.json",
            "protected-install-signature.json",
          ].sort();
          if (JSON.stringify((await readdir(exportRoot)).sort()) !== JSON.stringify(names)) {
            throw new Error("protected install export file set changed before cleanup");
          }
          for (const name of names) {
            const status = await lstat(join(exportRoot, name));
            if (
              !status.isFile()
              || status.isSymbolicLink()
              || status.uid !== 0
              || (status.mode & 0o777) !== 0o400
            ) throw new Error("protected install export boundary changed before cleanup");
          }
          for (const name of names) await unlink(join(exportRoot, name));
          const directory = await open(exportRoot, constants.O_RDONLY);
          try { await directory.sync(); } finally { await directory.close(); }
          const contextRoot = "/var/lib/spx-protected-install/context";
          const contextNames = [
            "verified-install-context.json",
            "verified-producer-context.json",
            "verified-backup-evidence-summary.json",
            "verified-migration-receipt.json",
            "verified-online-ddl-receipts.json",
            "verified-grant-evidence.json",
            "verified-service-activation-journal.json",
            "verified-watchdog-journal.json",
            "verified-health-evidence.json",
            "verified-watermark-evidence.json",
            "verified-rollback-readiness.json",
            "verified-signing-context.json",
            "protected-install-signing-intent.json",
            "protected-install-signature.json",
          ].sort();
          if (JSON.stringify((await readdir(contextRoot)).sort()) !== JSON.stringify(contextNames)) {
            throw new Error("protected install fixed context changed before cleanup");
          }
          for (const name of contextNames) {
            const path = join(contextRoot, name);
            const status = await lstat(path);
            if (
              !status.isFile()
              || status.isSymbolicLink()
              || status.uid !== 0
              || status.nlink !== 1
              || (status.mode & 0o777) !== 0o400
            ) throw new Error("protected install fixed context boundary changed before cleanup");
          }
          for (const name of contextNames) await unlink(join(contextRoot, name));
          const contextDirectory = await open(contextRoot, constants.O_RDONLY);
          try { await contextDirectory.sync(); } finally { await contextDirectory.close(); }
          NODE
          REMOTE

      - name: Report verified deployed identity
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          TARGET_DESCRIPTOR_ARTIFACT_ID: ${{ inputs.target_descriptor_artifact_id }}
          OPERATION_ID: ${{ steps.context.outputs.operation_id }}
          PAYLOAD_SHA256: ${{ steps.context.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          printf 'target=%s\nrelease_artifact_id=%s\ntarget_descriptor_artifact_id=%s\noperation_id=%s\npayload_sha256=%s\n' \
            "${TARGET}" "${RELEASE_ARTIFACT_ID}" "${TARGET_DESCRIPTOR_ARTIFACT_ID}" \
            "${OPERATION_ID}" "${PAYLOAD_SHA256}" >> "${GITHUB_STEP_SUMMARY}"
