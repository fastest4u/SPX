          test "$(read_context target)" = "${TARGET}"
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_ID}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${IMAGE_TAG}" = "spx-app:${SOURCE_SHA}"
          case "${TOPOLOGY}" in split) ;; *) exit 1 ;; esac
          if [ "${TARGET}" = production ]; then
