            PROTECTED_INSTALL_PRODUCER_FILES="context/verified-producer-context.json deploy/protected-install-evidence.schema.json scripts/protected-install-evidence.mjs scripts/protected-install-watchdog.mjs scripts/production-mutation-host-lock.mjs scripts/lib/evidence-artifact.mjs scripts/lib/mysql-connection-config.mjs scripts/lib/safe-file.mjs"
            verify_installed_producer() {
