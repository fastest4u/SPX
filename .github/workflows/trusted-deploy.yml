                test "$(stat -c %u "${PROTECTED_INSTALL_PRODUCER_ROOT}/${path}")" -eq 0
                test "$(stat -c %a "${PROTECTED_INSTALL_PRODUCER_ROOT}/${path}")" = 400
                test "$(stat -c %h "${PROTECTED_INSTALL_PRODUCER_ROOT}/${path}")" = 1
                cmp -s "${PRODUCER_STAGE}/${path}" "${PROTECTED_INSTALL_PRODUCER_ROOT}/${path}"
