          test "${READINESS_PORT}" -ge 1
          test "${READINESS_PORT}" -le 65535
          test -f "${ENVIRONMENT_FILE}"
          test ! -L "${ENVIRONMENT_FILE}"
          test "$(stat -c %U "${ENVIRONMENT_FILE}")" = root
          case "$(stat -c %a "${ENVIRONMENT_FILE}")" in 400|440|600|640) ;; *) exit 1 ;; esac

          verify_payload_file() {
            expected="$(read_context "$1")"
            test "$(sha256sum "${INCOMING}/$2" | cut -d' ' -f1)" = "${expected}"
          }
          verify_payload_file releaseManifestSha256 release/release-manifest.json
          verify_payload_file operatorBundleSha256 release/operator-bundle.tar
          verify_payload_file operatorIndexSha256 release/operator-bundle.index.json
          verify_payload_file imageArchiveSha256 release/spx-image.tar
          verify_payload_file descriptorArtifactSha256 target/deployment-target-descriptor.json
          verify_payload_file descriptorClaimsSha256 target/deployment-target-descriptor.attestation-claims.json
          verify_payload_file identityApprovalSha256 production-identity-approval.json

          node "${INCOMING}/release/bootstrap/scripts/build-operator-bundle.mjs" verify-archive \
            --archive="${INCOMING}/release/operator-bundle.tar" \
            --index="${INCOMING}/release/operator-bundle.index.json"
          node "${INCOMING}/release/bootstrap/scripts/build-operator-bundle.mjs" materialize \
            --archive="${INCOMING}/release/operator-bundle.tar" \
            --index="${INCOMING}/release/operator-bundle.index.json" \
            --root="${INCOMING}/operator"

          PRODUCTION_BINDING=""
          if [ "${TARGET}" = production ]; then
            PRODUCTION_BINDING="${INCOMING}/verified-release-binding.json"
            EVIDENCE_MODULE="${INCOMING}/operator/scripts/lib/evidence-artifact.mjs" \
            BINDING_PATH="${PRODUCTION_BINDING}" \
            BINDING_SOURCE_SHA="${SOURCE_SHA}" \
            BINDING_IMAGE_DIGEST="${IMAGE_ID}" \
            BINDING_RELEASE_MANIFEST_SHA256="${RELEASE_MANIFEST_SHA256}" \
            BINDING_TOPOLOGY="${TOPOLOGY}" \
            BINDING_COMPOSE_PROJECT="${COMPOSE_PROJECT}" \
            BINDING_TARGET_DESCRIPTOR_SHA256="${TARGET_SHA256}" \
            BINDING_OPERATOR_BUNDLE_SHA256="$(read_context operatorBundleSha256)" \
            BINDING_IDENTITY_APPROVAL_SHA256="$(read_context identityApprovalSha256)" \
              node --input-type=module - <<'NODE'
            import { writeFileSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const { canonicalJson, validateReleaseBinding } = await import(
