          NODE
          fi

          CURRENT_RELEASE=""
          if [ -L "${ACTIVE_PROJECTION}" ]; then CURRENT_RELEASE="$(readlink -f "${ACTIVE_PROJECTION}")"; fi
          CURRENT_PARENT=""
          ROLLBACK_IMAGE=""
          ROLLBACK_RELEASE_MANIFEST_SHA256=""
          ROLLBACK_SERVICE_SET_SHA256=""
          ROLLBACK_SERVICES=""
          ROLLBACK_CONFIG_SHA256=""
          ROLLBACK_RUNTIME_COMPATIBLE=false
          PROTECTED_ADOPTION_PRECONDITION=/var/lib/spx-production-mutation
          if [ "${TARGET}" = production ]; then
            test -d "${PROTECTED_ADOPTION_PRECONDITION}"
            test ! -L "${PROTECTED_ADOPTION_PRECONDITION}"
            test "$(stat -c %U "${PROTECTED_ADOPTION_PRECONDITION}")" = root
            test "$(( $(stat -c %a "${PROTECTED_ADOPTION_PRECONDITION}") % 100 ))" -eq 0
            test -n "${CURRENT_RELEASE}"
            case "${CURRENT_RELEASE}" in /root/spx-releases/*/operator) ;; *) exit 1 ;; esac
            CURRENT_PARENT="$(dirname "${CURRENT_RELEASE}")"
            test -f "${CURRENT_PARENT}/deployment-context.json"
            test -f "${CURRENT_PARENT}/release-manifest.json"
            test -f "${CURRENT_PARENT}/production-identity-approval.json"
            ROLLBACK_IMAGE="$(node -p 'require(process.argv[1]).imageId' "${CURRENT_PARENT}/release-manifest.json")"
            [[ "${ROLLBACK_IMAGE}" =~ ^sha256:[0-9a-f]{64}$ ]]
            ROLLBACK_RELEASE_MANIFEST_SHA256="$(sha256sum "${CURRENT_PARENT}/release-manifest.json" | cut -d' ' -f1)"
            ROLLBACK_CONFIG_SHA256="$(sha256sum "${CURRENT_PARENT}/deployment-context.json" | cut -d' ' -f1)"
            previous_topology="$(node -p 'require(process.argv[1]).topology' "${CURRENT_PARENT}/deployment-context.json")"
            ROLLBACK_SERVICES="$(node -p 'require(process.argv[1]).services.join(" ")' "${CURRENT_PARENT}/production-identity-approval.json")"
            ROLLBACK_SERVICE_SET_SHA256="$(printf '%s' "${previous_topology}|${ROLLBACK_SERVICES}" | sha256sum | cut -d' ' -f1)"
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const previous=JSON.parse(readFileSync(process.argv[1],"utf8"));
              const candidate=JSON.parse(readFileSync(process.argv[2],"utf8"));
              const classification=JSON.parse(readFileSync(process.argv[3],"utf8"));
              const previousContext=JSON.parse(readFileSync(process.argv[4],"utf8"));
              const previousApproval=JSON.parse(readFileSync(process.argv[5],"utf8"));
              for(const release of [previous,candidate]) {
                if(!Number.isSafeInteger(release.schema?.min) || !Number.isSafeInteger(release.schema?.max) || release.schema.min < 0 || release.schema.min > release.schema.max) throw new Error("release schema range is invalid");
