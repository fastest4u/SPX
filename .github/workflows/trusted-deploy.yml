          const path=process.env.ROLLBACK_JOURNAL;
          const descriptor=openSync(path, constants.O_CREAT|constants.O_EXCL|constants.O_WRONLY|(constants.O_NOFOLLOW??0), 0o400);
          try { writeSync(descriptor, `${JSON.stringify(value)}\n`); fsyncSync(descriptor); } finally { closeSync(descriptor); }
          const directory=openSync(process.env.ROLLBACK_STATE_DIR, constants.O_RDONLY);
          try { fsyncSync(directory); } finally { closeSync(directory); }
          NODE
          ROLLBACK_SHA256="$(sha256sum "${ROLLBACK_JOURNAL}" | cut -d' ' -f1)"
          LOCKED=false
          SLOT_CLAIM_ATTEMPTED=false
          PROTECTED_INSTALL_COMMIT_STARTED=false
          RUNTIME_DEPS_CONTAINER=""
          PROTECTED_PREPARED=false
          PROTECTED_RESTORED=false
          PROTECTED_CONTENT_RESTORED=false
          PROTECTED_DEPLOYMENT_COMMITTED=false
          PROTECTED_MUTATED=false
          CAPABILITY_BACKUP=""
          CA_BACKUP=""
          DATABASE_BACKUP=""
          FINAL_POLICY_BACKUP=""
          FINAL_TOKEN_BACKUP=""
          CAPABILITY_CAPTURED=false
          CA_CAPTURED=false
          DATABASE_CAPTURED=false
          FINAL_POLICY_CAPTURED=false
          FINAL_TOKEN_CAPTURED=false
          protected_path_hash() {
            protected_path="$1"
            if [ -d "${protected_path}" ]; then
              (cd "${protected_path}" && {
                find . -mindepth 1 -printf '%y %m %P\n' | LC_ALL=C sort || exit $?
                find . -type f -print0 | LC_ALL=C sort -z | xargs -0 -r sha256sum || exit $?
              } | sha256sum | cut -d' ' -f1) || return $?
            else
              sha256sum "${protected_path}" | cut -d' ' -f1 || return $?
            fi
          }
          assert_protected_path_absent() {
            if [ -e "$1" ] || [ -L "$1" ]; then return 1; fi
          }
          capture_protected_prior() {
            protected_key="$1"
            protected_path="$2"
            protected_backup="$3"
            protected_kind="$4"
            if [ -e "${protected_path}" ] || [ -L "${protected_path}" ]; then
              test ! -L "${protected_path}" || return $?
              if [ "${protected_kind}" = directory ]; then
                test -d "${protected_path}" || return $?
              else
                test -f "${protected_path}" || return $?
              fi
              protected_owner="$(stat -c %U "${protected_path}")" || return $?
              test "${protected_owner}" = root || return $?
              protected_mode_value="$(stat -c %a "${protected_path}")" || return $?
              protected_hash_value="$(protected_path_hash "${protected_path}")" || return $?
              printf -v "${protected_key}_EXISTED" '%s' true || return $?
              printf -v "${protected_key}_MODE" '%s' "${protected_mode_value}" || return $?
              printf -v "${protected_key}_HASH" '%s' "${protected_hash_value}" || return $?
              assert_protected_path_absent "${protected_backup}" || return $?
              cp -a --reflink=auto -- "${protected_path}" "${protected_backup}" || return $?
              sync -f "${protected_backup}" || return $?
            else
              printf -v "${protected_key}_EXISTED" '%s' false || return $?
              printf -v "${protected_key}_MODE" '%s' absent || return $?
              printf -v "${protected_key}_HASH" '%s' absent || return $?
            fi
            printf -v "${protected_key}_CAPTURED" '%s' true || return $?
          }
          restore_protected_object() {
            protected_key="$1"
            protected_path="$2"
            protected_backup="$3"
            protected_kind="$4"
            protected_captured="${protected_key}_CAPTURED"
            if [ "${!protected_captured}" != true ]; then return 0; fi
            protected_existed="${protected_key}_EXISTED"
            protected_mode="${protected_key}_MODE"
            protected_hash="${protected_key}_HASH"
            protected_restore="${protected_path}.${OPERATION_ID}.restore"
            rm -rf -- "${protected_restore}" || return $?
            assert_protected_path_absent "${protected_restore}" || return $?
            if [ "${!protected_existed}" = true ]; then
              test -e "${protected_backup}" || return $?
              test ! -L "${protected_backup}" || return $?
              cp -a --reflink=auto -- "${protected_backup}" "${protected_restore}" || return $?
              test ! -L "${protected_restore}" || return $?
              if [ "${protected_kind}" = directory ]; then
                test -d "${protected_restore}" || return $?
                rm -rf -- "${protected_path}" || return $?
                assert_protected_path_absent "${protected_path}" || return $?
                mv -T "${protected_restore}" "${protected_path}" || return $?
              else
                test -f "${protected_restore}" || return $?
                mv -Tf "${protected_restore}" "${protected_path}" || return $?
              fi
              test ! -L "${protected_path}" || return $?
              if [ "${protected_kind}" = directory ]; then
                test -d "${protected_path}" || return $?
              else
                test -f "${protected_path}" || return $?
              fi
              protected_actual_mode="$(stat -c %a "${protected_path}")" || return $?
              test "${protected_actual_mode}" = "${!protected_mode}" || return $?
              protected_actual_owner="$(stat -c %U "${protected_path}")" || return $?
              test "${protected_actual_owner}" = root || return $?
