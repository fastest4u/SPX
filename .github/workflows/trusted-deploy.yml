          fi

          CONTEXT="${INCOMING}/deployment-context.json"
          read_context() { node -e 'const v=require(process.argv[1]); const x=v[process.argv[2]]; if(typeof x!=="string") process.exit(1); process.stdout.write(x)' "${CONTEXT}" "$1"; }
          read_context_number() { node -e 'const v=require(process.argv[1]); const x=v[process.argv[2]]; if(!Number.isSafeInteger(x)) process.exit(1); process.stdout.write(String(x))' "${CONTEXT}" "$1"; }
          SOURCE_SHA="$(read_context sourceSha)"
          IMAGE_ID="$(read_context imageId)"
          IMAGE_TAG="$(read_context imageTag)"
          TOPOLOGY="$(read_context topology)"
