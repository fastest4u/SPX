            const binding = validateReleaseBinding({
              candidateSha: process.env.BINDING_SOURCE_SHA,
              imageDigest: process.env.BINDING_IMAGE_DIGEST,
              releaseManifestSha256: process.env.BINDING_RELEASE_MANIFEST_SHA256,
              environment: "supervised-production",
              topology: process.env.BINDING_TOPOLOGY,
