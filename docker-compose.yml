x-spx-image: &spx-image
  image: ${SPX_IMAGE:?SPX_IMAGE is required}

x-spx-common: &spx-common
  <<: *spx-image
  labels:
    com.spx.environment: ${SPX_RUNTIME_ENVIRONMENT:-production}
    com.spx.release-sha: ${SPX_RELEASE_SHA:?SPX_RELEASE_SHA is required}
    com.spx.target-descriptor-sha256: ${SPX_TARGET_DESCRIPTOR_SHA256:?SPX_TARGET_DESCRIPTOR_SHA256 is required}
    com.spx.operator-bundle-sha256: ${SPX_OPERATOR_BUNDLE_SHA256:?SPX_OPERATOR_BUNDLE_SHA256 is required}
    com.spx.staging-run-id: ${SPX_STAGING_RUN_ID:-not-staging}
  configs:
    - source: spx_release_manifest
      target: /run/secrets/spx-release-manifest
      mode: 0444
    - source: spx_target_descriptor
      target: /run/secrets/spx-target-descriptor
      mode: 0444
    - source: spx_deployment_context
      target: /run/secrets/spx-deployment-context
      mode: 0444
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  mem_limit: 1g
  cpus: "1.0"
  init: true
  restart: unless-stopped
  stop_grace_period: 120s
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "5"

x-spx-db-environment: &spx-db-environment
  DB_MODE: mysql
  DB_HOST: ${SPX_DB_HOST:?SPX_DB_HOST is required}
  DB_PORT: "${SPX_DB_PORT:-3306}"
  DB_NAME: ${SPX_DB_NAME:?SPX_DB_NAME is required}
  DB_SSL_MODE: verify-identity
  DB_SSL_CA_FILE: /run/config/db-ca.pem
  DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}

x-spx-worker-healthcheck: &spx-worker-healthcheck
  test: ["CMD", "node", "scripts/worker-healthcheck.mjs", "--max-age-ms=45000"]
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-spx-process-healthcheck: &spx-process-healthcheck
  test: ["CMD-SHELL", "ps | grep -q '[n]ode dist/app.js'"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 20s

x-spx-http-healthcheck: &spx-http-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "const port=process.env.HTTP_PORT||3000; fetch('http://127.0.0.1:'+port+'/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
    ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 90s

x-spx-tcp-proxy-healthcheck: &spx-tcp-proxy-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "const net=require('node:net');const s=net.connect(3306,'127.0.0.1');s.once('connect',()=>{s.destroy();process.exit(0)});s.once('error',()=>process.exit(1));setTimeout(()=>process.exit(1),1500).unref()",
    ]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  migrator:
    <<: *spx-common
    profiles: ["migration"]
    restart: "no"
    environment:
      <<: *spx-db-environment
      SPX_ROLE: migrator
      HTTP_ENABLED: "false"
      DB_USERNAME: ${SPX_DB_USERNAME_MIGRATOR:?SPX_DB_USERNAME_MIGRATOR is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    secrets:
      - source: db_password_migrator
        target: db_password
        mode: 0444
    command: ["node", "dist/scripts/db-migrate.js"]

  # Rollback-only legacy topology. Current production releases are split-only;
  # production notifier startup also requires a remote, provider-fenced LINE service.
  notifier:
    <<: *spx-common
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *spx-db-environment
      SPX_ROLE: notifier
      SPX_NODE_ID: prod-notifier-1
      HTTP_ENABLED: "true"
      HTTP_PORT: "3000"
      DB_USERNAME: ${SPX_DB_USERNAME_NOTIFIER:?SPX_DB_USERNAME_NOTIFIER is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      COOKIE_SECRET_FILE: /run/secrets/cookie_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      NOTIFICATION_NODE_SECRETS_FILE: /run/secrets/notification_node_secrets
      OCR_NODE_SECRET_FILE: /run/secrets/ocr_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      REALTIME_NODE_SECRETS_FILE: /run/secrets/realtime_node_secrets
      NOTIFICATION_ALLOWED_NODE_TEAMS: ${SPX_NOTIFICATION_ALLOWED_NODE_TEAMS:?SPX_NOTIFICATION_ALLOWED_NODE_TEAMS is required}
      ADMIN_USERNAME: ${SPX_ADMIN_USERNAME:?SPX_ADMIN_USERNAME is required}
      ADMIN_ROLE: admin
      OCR_SERVICE_URL: ${SPX_NOTIFIER_OCR_SERVICE_URL:?SPX_NOTIFIER_OCR_SERVICE_URL is required}
      LINEJS_TEST_STORAGE_PATH: /app/data/line-state/linejs-storage.json
      REALTIME_SERVICE_URL: ${SPX_REALTIME_NOTIFIER_URL:-}
      REALTIME_ALLOWED_NODE_TEAMS: ${SPX_REALTIME_ALLOWED_NODE_TEAMS_NOTIFIER:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: line-state-legacy
        target: /app/data/line-state
      - type: volume
        source: line-images-legacy
        target: /app/data/line-images
    secrets:
      - source: db_password_notifier
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: jwt_secret
        target: jwt_secret
        mode: 0444
      - source: cookie_secret
        target: cookie_secret
        mode: 0444
      - source: admin_password
        target: admin_password
        mode: 0444
      - source: notification_node_secrets
        target: notification_node_secrets
        mode: 0444
      - source: ocr_node_secret_notifier
        target: ocr_node_secret
        mode: 0444
      - source: realtime_shared_secret_notifier
        target: realtime_shared_secret
        mode: 0444
      - source: realtime_node_secrets_notifier
        target: realtime_node_secrets
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-http-healthcheck

  # Optional split-service topology. Stop legacy services before starting the explicitly named split services:
  #   docker compose stop notifier worker-ifn worker-ptwl
  #   docker compose --profile split up --detach \
  #     web-api notification-service line-service ocr-service \
  #     worker-ifn-split worker-ptwl-split
  web-api:
    <<: *spx-common
    profiles: ["split"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *spx-db-environment
      SPX_ROLE: api
      SPX_NODE_ID: prod-web-api-1
      HTTP_ENABLED: "true"
      HTTP_PORT: "3000"
      DB_USERNAME: ${SPX_DB_USERNAME_WEB_API:?SPX_DB_USERNAME_WEB_API is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      COOKIE_SECRET_FILE: /run/secrets/cookie_secret
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      LINE_SERVICE_ADMIN_SECRET_FILE: /run/secrets/line_service_admin_secret
      OCR_NODE_SECRET_FILE: /run/secrets/ocr_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      REALTIME_NODE_SECRETS_FILE: /run/secrets/realtime_node_secrets
      ADMIN_USERNAME: ${SPX_ADMIN_USERNAME:?SPX_ADMIN_USERNAME is required}
      ADMIN_ROLE: admin
      LINE_SERVICE_URL: http://line-service:3003
      OCR_SERVICE_URL: http://ocr-service:3004
      REALTIME_SERVICE_URL: ${SPX_REALTIME_WEB_API_URL:-}
      REALTIME_ALLOWED_NODE_TEAMS: ${SPX_REALTIME_ALLOWED_NODE_TEAMS_WEB_API:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: line-images-split
        target: /app/data/line-images
        read_only: true
    secrets:
      - source: db_password_web_api
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: jwt_secret
        target: jwt_secret
        mode: 0444
      - source: cookie_secret
        target: cookie_secret
        mode: 0444
      - source: admin_password
        target: admin_password
        mode: 0444
      - source: line_service_admin_secret
        target: line_service_admin_secret
        mode: 0444
      - source: ocr_node_secret_web_api
        target: ocr_node_secret
        mode: 0444
      - source: realtime_shared_secret_web_api
        target: realtime_shared_secret
        mode: 0444
      - source: realtime_node_secrets_web_api
        target: realtime_node_secrets
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-http-healthcheck

  notification-service:
    <<: *spx-common
    profiles: ["split"]
    expose:
      - "3002"
    environment:
      <<: *spx-db-environment
      SPX_ROLE: notification-service
      SPX_NODE_ID: prod-notification-service-1
      HTTP_ENABLED: "true"
      HTTP_PORT: "3002"
      DB_USERNAME: ${SPX_DB_USERNAME_NOTIFICATION_SERVICE:?SPX_DB_USERNAME_NOTIFICATION_SERVICE is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      LINE_SERVICE_SEND_SECRET_FILE: /run/secrets/line_service_send_secret
      NOTIFICATION_NODE_SECRETS_FILE: /run/secrets/notification_node_secrets
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      REALTIME_NODE_SECRETS_FILE: /run/secrets/realtime_node_secrets
      NOTIFICATION_ALLOWED_NODE_TEAMS: ${SPX_NOTIFICATION_ALLOWED_NODE_TEAMS:?SPX_NOTIFICATION_ALLOWED_NODE_TEAMS is required}
      LINE_SERVICE_URL: http://line-service:3003
      REALTIME_SERVICE_URL: ${SPX_REALTIME_NOTIFICATION_SERVICE_URL:-}
      REALTIME_ALLOWED_NODE_TEAMS: ${SPX_REALTIME_ALLOWED_NODE_TEAMS_NOTIFICATION_SERVICE:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    secrets:
      - source: db_password_notification_service
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: line_service_send_secret_notification_service
        target: line_service_send_secret
        mode: 0444
      - source: notification_node_secrets
        target: notification_node_secrets
        mode: 0444
      - source: realtime_shared_secret_notification_service
        target: realtime_shared_secret
        mode: 0444
      - source: realtime_node_secrets_notification_service
        target: realtime_node_secrets
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-http-healthcheck

  line-service:
    <<: *spx-common
    profiles: ["split"]
    expose:
      - "3003"
    environment:
      <<: *spx-db-environment
      SPX_ROLE: line-service
      SPX_NODE_ID: prod-line-service-1
      HTTP_ENABLED: "true"
      HTTP_PORT: "3003"
      DB_USERNAME: ${SPX_DB_USERNAME_LINE_SERVICE:?SPX_DB_USERNAME_LINE_SERVICE is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      LINE_SERVICE_SEND_NODE_SECRETS_FILE: /run/secrets/line_service_send_node_secrets
      LINE_SERVICE_ADMIN_SECRET_FILE: /run/secrets/line_service_admin_secret
      OCR_NODE_SECRET_FILE: /run/secrets/ocr_node_secret
      LINE_SEND_ALLOWED_NODE_IDS: ${SPX_LINE_SEND_ALLOWED_NODE_IDS:?SPX_LINE_SEND_ALLOWED_NODE_IDS is required}
      LINE_ADMIN_ALLOWED_NODE_IDS: ${SPX_LINE_ADMIN_ALLOWED_NODE_IDS:?SPX_LINE_ADMIN_ALLOWED_NODE_IDS is required}
      LINEJS_TEST_ENABLED: "true"
      LINEJS_TEST_STORAGE_PATH: /app/data/line-state/linejs-storage.json
      OCR_SERVICE_URL: http://ocr-service:3004
      GATE6_CONTROL_NODE_SECRET_FILE: /run/secrets/gate6_control_node_secret
      GATE6_LINE_PERMIT_KEY_ID: ${SPX_GATE6_LINE_PERMIT_KEY_ID:?SPX_GATE6_LINE_PERMIT_KEY_ID is required}
      GATE6_LINE_PERMIT_PUBLIC_KEY_FILE: /run/secrets/gate6_line_permit_public_key
      GATE6_CONTROL_REQUEST_TIMEOUT_MS: "${SPX_GATE6_CONTROL_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: line-state-split
        target: /app/data/line-state
      - type: volume
        source: line-images-split
        target: /app/data/line-images
    secrets:
      - source: db_password_line_service
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: line_service_send_node_secrets
        target: line_service_send_node_secrets
        mode: 0444
      - source: line_service_admin_secret
        target: line_service_admin_secret
        mode: 0444
      - source: ocr_node_secret_line_service
        target: ocr_node_secret
        mode: 0444
      - source: gate6_control_node_secret_line
        target: gate6_control_node_secret
        mode: 0444
      - source: gate6_line_permit_public_key
        target: gate6_line_permit_public_key
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-http-healthcheck
    networks:
      default:
      gate6-control-internal:

  ocr-service:
    <<: *spx-common
    profiles: ["split"]
    expose:
      - "3004"
    environment:
      SPX_ROLE: ocr-service
      SPX_NODE_ID: prod-ocr-service-1
      HTTP_ENABLED: "true"
      HTTP_PORT: "3004"
      OCR_NODE_SECRETS_FILE: /run/secrets/ocr_node_secrets
      OCR_ALLOWED_LINE_NODE_IDS: ${SPX_OCR_ALLOWED_LINE_NODE_IDS:?SPX_OCR_ALLOWED_LINE_NODE_IDS is required}
      OCR_ADMIN_NODE_IDS: ${SPX_OCR_ADMIN_NODE_IDS:?SPX_OCR_ADMIN_NODE_IDS is required}
      OCR_REPLAY_LEDGER_DIR: /app/data/internal-replay
      CODEX_IMAGE_PROVIDER: codex-device
      GATE6_CONTROL_NODE_SECRET_FILE: /run/secrets/gate6_control_node_secret
      GATE6_OCR_PERMIT_KEY_ID: ${SPX_GATE6_OCR_PERMIT_KEY_ID:?SPX_GATE6_OCR_PERMIT_KEY_ID is required}
      GATE6_OCR_PERMIT_PUBLIC_KEY_FILE: /run/secrets/gate6_ocr_permit_public_key
      GATE6_CONTROL_REQUEST_TIMEOUT_MS: "${SPX_GATE6_CONTROL_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: volume
        source: ocr-auth
        target: /app/data
      - type: volume
        source: line-images-split
        target: /app/data/line-images
        read_only: true
    secrets:
      - source: ocr_node_secrets
        target: ocr_node_secrets
        mode: 0444
      - source: gate6_control_node_secret_ocr
        target: gate6_control_node_secret
        mode: 0444
      - source: gate6_ocr_permit_public_key
        target: gate6_ocr_permit_public_key
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-http-healthcheck
    networks:
      default:
      gate6-control-internal:

  worker-ifn-split:
    <<: *spx-common
    profiles: ["split"]
    depends_on:
      notification-service:
        condition: service_healthy
    environment:
      <<: *spx-db-environment
      SPX_ROLE: worker
      SPX_NODE_ID: prod-worker-ifn-split-1
      HTTP_ENABLED: "false"
      RUN_TEAM_IDS: "2"
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_IFN_SPLIT:?SPX_DB_USERNAME_WORKER_IFN_SPLIT is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      NOTIFICATION_NODE_SECRET_FILE: /run/secrets/notification_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      NOTIFIER_API_URL: http://notification-service:3002/internal/notification-events
      NOTIFIER_LOCAL_SPOOL_PATH: /app/spool/notification-spool.jsonl
      REALTIME_SERVICE_URL: ${SPX_REALTIME_WORKER_IFN_SPLIT_URL:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: spool-worker-ifn-split
        target: /app/spool
    secrets:
      - source: db_password_worker_ifn_split
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: notification_node_secret_worker_ifn_split
        target: notification_node_secret
        mode: 0444
      - source: realtime_shared_secret_worker_ifn_split
        target: realtime_shared_secret
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-worker-healthcheck

  worker-ptwl-split:
    <<: *spx-common
    profiles: ["split"]
    depends_on:
      notification-service:
        condition: service_healthy
    environment:
      <<: *spx-db-environment
      SPX_ROLE: worker
      SPX_NODE_ID: prod-worker-ptwl-split-1
      HTTP_ENABLED: "false"
      RUN_TEAM_IDS: "1"
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_PTWL_SPLIT:?SPX_DB_USERNAME_WORKER_PTWL_SPLIT is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      NOTIFICATION_NODE_SECRET_FILE: /run/secrets/notification_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      NOTIFIER_API_URL: http://notification-service:3002/internal/notification-events
      NOTIFIER_LOCAL_SPOOL_PATH: /app/spool/notification-spool.jsonl
      REALTIME_SERVICE_URL: ${SPX_REALTIME_WORKER_PTWL_SPLIT_URL:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: spool-worker-ptwl-split
        target: /app/spool
    secrets:
      - source: db_password_worker_ptwl_split
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: notification_node_secret_worker_ptwl_split
        target: notification_node_secret
        mode: 0444
      - source: realtime_shared_secret_worker_ptwl_split
        target: realtime_shared_secret
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-worker-healthcheck

  worker-ifn:
    <<: *spx-common
    depends_on:
      notifier:
        condition: service_healthy
    environment:
      <<: *spx-db-environment
      SPX_ROLE: worker
      SPX_NODE_ID: prod-worker-ifn-1
      HTTP_ENABLED: "false"
      RUN_TEAM_IDS: "2"
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_IFN:?SPX_DB_USERNAME_WORKER_IFN is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      NOTIFICATION_NODE_SECRET_FILE: /run/secrets/notification_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      NOTIFIER_API_URL: http://notifier:3000/internal/notification-events
      NOTIFIER_LOCAL_SPOOL_PATH: /app/spool/notification-spool.jsonl
      REALTIME_SERVICE_URL: ${SPX_REALTIME_WORKER_IFN_URL:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
      - type: volume
        source: spool-worker-ifn
        target: /app/spool
    secrets:
      - source: db_password_worker_ifn
        target: db_password
        mode: 0444
      - source: secrets_key
        target: secrets_key
        mode: 0444
      - source: notification_node_secret_worker_ifn
        target: notification_node_secret
        mode: 0444
      - source: realtime_shared_secret_worker_ifn
        target: realtime_shared_secret
        mode: 0444
    command: ["node", "dist/app.js"]
    healthcheck: *spx-worker-healthcheck

  worker-ptwl:
    <<: *spx-common
    depends_on:
      notifier:
        condition: service_healthy
    environment:
      <<: *spx-db-environment
      SPX_ROLE: worker
      SPX_NODE_ID: prod-worker-ptwl-1
      HTTP_ENABLED: "false"
      RUN_TEAM_IDS: "1"
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_PTWL:?SPX_DB_USERNAME_WORKER_PTWL is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      SECRETS_KEY_FILE: /run/secrets/secrets_key
      NOTIFICATION_NODE_SECRET_FILE: /run/secrets/notification_node_secret
      REALTIME_SHARED_SECRET_FILE: /run/secrets/realtime_shared_secret
      NOTIFIER_API_URL: http://notifier:3000/internal/notification-events
      NOTIFIER_LOCAL_SPOOL_PATH: /app/spool/notification-spool.jsonl
      REALTIME_SERVICE_URL: ${SPX_REALTIME_WORKER_PTWL_URL:-}
      REALTIME_REQUEST_TIMEOUT_MS: "${SPX_REALTIME_REQUEST_TIMEOUT_MS:-1500}"
