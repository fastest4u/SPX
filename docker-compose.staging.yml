name: spx-staging

x-staging-environment: &staging-environment
  SPX_ENVIRONMENT: staging
  DB_NAME: spx_staging
  AUTO_ACCEPT_JOB_REAL_WORKER_ENABLED: "false"
  AUTO_ACCEPT_JOB_SETTLEMENT_WORKER_ENABLED: "false"

x-staging-limits: &staging-limits
  mem_limit: 512m
  cpus: "0.50"
  pids_limit: 192

x-n-minus-one-environment: &n-minus-one-environment
  SPX_PROBE_ONLY: "true"
  SPX_ENVIRONMENT: staging
  HTTP_ENABLED: "false"
  NOTIFY_ENABLED: "false"
  LINEJS_TEST_ENABLED: "false"
  AUTO_ACCEPT_ENABLED: "false"
  AUTO_ACCEPT_JOB_SHADOW_ENABLED: "false"
  AUTO_ACCEPT_JOB_DRY_RUN_WORKER_ENABLED: "false"
  AUTO_ACCEPT_JOB_REAL_WORKER_ENABLED: "false"
  AUTO_ACCEPT_JOB_SETTLEMENT_WORKER_ENABLED: "false"
  AUTO_ACCEPT_JOB_PENDING_REQUEST_CUTOVER_ENABLED: "false"
  AUTO_ACCEPT_JOB_FAST_ACCEPT_ALL_CUTOVER_ENABLED: "false"

x-n-minus-one-common: &n-minus-one-common
  image: ${SPX_N_MINUS_ONE_IMAGE:?SPX_N_MINUS_ONE_IMAGE is required}
  profiles: ["n-minus-one"]
  labels:
    com.spx.environment: staging
    com.spx.release-sha: ${SPX_N_MINUS_ONE_RELEASE_SHA:?SPX_N_MINUS_ONE_RELEASE_SHA is required}
    com.spx.target-descriptor-sha256: ${SPX_TARGET_DESCRIPTOR_SHA256:?SPX_TARGET_DESCRIPTOR_SHA256 is required}
    com.spx.operator-bundle-sha256: ${SPX_OPERATOR_BUNDLE_SHA256:?SPX_OPERATOR_BUNDLE_SHA256 is required}
    com.spx.staging-run-id: ${SPX_STAGING_RUN_ID:?SPX_STAGING_RUN_ID is required}
    com.spx.n-minus-one: "true"
  command: ["node", "dist/scripts/phase4-n-minus-one-role-probe.js"]
  pull_policy: never
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  mem_limit: 256m
  cpus: "0.25"
  init: true
  restart: "no"

services:
  migrator:
    <<: *staging-limits
    environment:
      <<: *staging-environment

  notifier:
    <<: *staging-limits
    ports: !override
      - "127.0.0.1:3100:3000"
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-notifier-1

  web-api:
    <<: *staging-limits
    ports: !override
      - "127.0.0.1:3100:3000"
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-web-api-1

  notification-service:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-notification-service-1

  line-service:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-line-service-1

  ocr-service:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-ocr-service-1

  worker-ifn-split:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-worker-ifn-split-1

  worker-ptwl-split:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-worker-ptwl-split-1

  worker-ifn:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-worker-ifn-1

  worker-ptwl:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-worker-ptwl-1

  poller-ifn-phase3:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-poller-ifn-phase3-1

  auto-accept-ifn-phase3:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-auto-accept-ifn-phase3-1

  poller-ptwl-phase3:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-poller-ptwl-phase3-1

  auto-accept-ptwl-phase3:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-auto-accept-ptwl-phase3-1

  realtime-service:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-realtime-service-1
      DB_HOST: staging-db-proxy
      DB_SSL_SERVERNAME: ${STAGING_DB_UPSTREAM_TLS_SERVERNAME:?STAGING_DB_UPSTREAM_TLS_SERVERNAME is required}

  gate6-control:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-gate6-control-1

  gate6-task9-controller:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-gate6-task9-controller-1

  gate6-monitor-probe:
    <<: *staging-limits
    environment:
      <<: *staging-environment
      SPX_NODE_ID: stg-gate6-monitor-probe-1

  staging-db-proxy:
    image: ${SPX_IMAGE:?SPX_IMAGE is required}
    profiles: ["phase4"]
    labels:
      com.spx.environment: staging
      com.spx.release-sha: ${SPX_RELEASE_SHA:?SPX_RELEASE_SHA is required}
      com.spx.target-descriptor-sha256: ${SPX_TARGET_DESCRIPTOR_SHA256:?SPX_TARGET_DESCRIPTOR_SHA256 is required}
      com.spx.operator-bundle-sha256: ${SPX_OPERATOR_BUNDLE_SHA256:?SPX_OPERATOR_BUNDLE_SHA256 is required}
      com.spx.staging-run-id: ${SPX_STAGING_RUN_ID:?SPX_STAGING_RUN_ID is required}
    command: ["node", "scripts/staging-db-proxy.mjs"]
    environment:
      STAGING_DB_PROXY_LISTEN_HOST: "0.0.0.0"
      STAGING_DB_PROXY_LISTEN_PORT: "3306"
      STAGING_DB_UPSTREAM_HOST: ${STAGING_DB_UPSTREAM_HOST:?STAGING_DB_UPSTREAM_HOST is required}
      STAGING_DB_UPSTREAM_PORT: "${STAGING_DB_UPSTREAM_PORT:-3306}"
      STAGING_DB_PROXY_MAX_CONNECTIONS: "${STAGING_DB_PROXY_MAX_CONNECTIONS:-64}"
    expose: ["3306"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    init: true
    restart: unless-stopped
    networks:
      default:
      staging-db-egress:

  n-minus-one-db-proxy:
    image: ${SPX_IMAGE:?SPX_IMAGE is required}
    profiles: ["n-minus-one"]
    labels:
      com.spx.environment: staging
      com.spx.release-sha: ${SPX_RELEASE_SHA:?SPX_RELEASE_SHA is required}
      com.spx.target-descriptor-sha256: ${SPX_TARGET_DESCRIPTOR_SHA256:?SPX_TARGET_DESCRIPTOR_SHA256 is required}
      com.spx.operator-bundle-sha256: ${SPX_OPERATOR_BUNDLE_SHA256:?SPX_OPERATOR_BUNDLE_SHA256 is required}
      com.spx.staging-run-id: ${SPX_STAGING_RUN_ID:?SPX_STAGING_RUN_ID is required}
      com.spx.n-minus-one: "true"
    command: ["node", "scripts/staging-db-proxy.mjs"]
    environment:
      STAGING_DB_PROXY_LISTEN_HOST: "0.0.0.0"
      STAGING_DB_PROXY_LISTEN_PORT: "3306"
      STAGING_DB_UPSTREAM_HOST: ${SPX_DB_HOST:?SPX_DB_HOST is required}
      STAGING_DB_UPSTREAM_PORT: "${SPX_DB_PORT:-3306}"
      STAGING_DB_PROXY_MAX_CONNECTIONS: "${STAGING_DB_PROXY_MAX_CONNECTIONS:-64}"
    expose: ["3306"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: "0.25"
    init: true
    restart: "no"
    networks:
      n-minus-one-internal:
      n-minus-one-db-egress:

  n-minus-one-web-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: api
      SPX_NODE_ID: stg-n-minus-one-web-api
      RUN_TEAM_IDS: ""
      DB_MODE: mysql
      DB_HOST: n-minus-one-db-proxy
      DB_PORT: "${SPX_DB_PORT:-3306}"
      DB_NAME: spx_staging
      DB_USERNAME: ${SPX_DB_USERNAME_WEB_API:?SPX_DB_USERNAME_WEB_API is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_MODE: verify-identity
      DB_SSL_CA_FILE: /run/config/db-ca.pem
      DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}
    secrets:
      - source: db_password_web_api
        target: db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    networks:
      n-minus-one-internal:

  n-minus-one-notification-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: notification-service
      SPX_NODE_ID: stg-n-minus-one-notification-service
      RUN_TEAM_IDS: ""
      DB_MODE: mysql
      DB_HOST: n-minus-one-db-proxy
      DB_PORT: "${SPX_DB_PORT:-3306}"
      DB_NAME: spx_staging
      DB_USERNAME: ${SPX_DB_USERNAME_NOTIFICATION_SERVICE:?SPX_DB_USERNAME_NOTIFICATION_SERVICE is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_MODE: verify-identity
      DB_SSL_CA_FILE: /run/config/db-ca.pem
      DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}
    secrets:
      - source: db_password_notification_service
        target: db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    networks:
      n-minus-one-internal:

  n-minus-one-line-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: line-service
      SPX_NODE_ID: stg-n-minus-one-line-service
      RUN_TEAM_IDS: ""
      DB_MODE: mysql
      DB_HOST: n-minus-one-db-proxy
      DB_PORT: "${SPX_DB_PORT:-3306}"
      DB_NAME: spx_staging
      DB_USERNAME: ${SPX_DB_USERNAME_LINE_SERVICE:?SPX_DB_USERNAME_LINE_SERVICE is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_MODE: verify-identity
      DB_SSL_CA_FILE: /run/config/db-ca.pem
      DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}
    secrets:
      - source: db_password_line_service
        target: db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    networks:
      n-minus-one-internal:

  n-minus-one-ocr-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: ocr-service
      SPX_NODE_ID: stg-n-minus-one-ocr-service
      RUN_TEAM_IDS: ""
    network_mode: none

  n-minus-one-worker-ifn-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: worker
      SPX_NODE_ID: stg-n-minus-one-worker-ifn-split
      RUN_TEAM_IDS: "2"
      DB_MODE: mysql
      DB_HOST: n-minus-one-db-proxy
      DB_PORT: "${SPX_DB_PORT:-3306}"
      DB_NAME: spx_staging
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_IFN_SPLIT:?SPX_DB_USERNAME_WORKER_IFN_SPLIT is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_MODE: verify-identity
      DB_SSL_CA_FILE: /run/config/db-ca.pem
      DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}
    secrets:
      - source: db_password_worker_ifn_split
        target: db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    networks:
      n-minus-one-internal:

  n-minus-one-worker-ptwl-probe:
    <<: *n-minus-one-common
    environment:
      <<: *n-minus-one-environment
      SPX_ROLE: worker
      SPX_NODE_ID: stg-n-minus-one-worker-ptwl-split
      RUN_TEAM_IDS: "1"
      DB_MODE: mysql
      DB_HOST: n-minus-one-db-proxy
      DB_PORT: "${SPX_DB_PORT:-3306}"
      DB_NAME: spx_staging
      DB_USERNAME: ${SPX_DB_USERNAME_WORKER_PTWL_SPLIT:?SPX_DB_USERNAME_WORKER_PTWL_SPLIT is required}
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_SSL_MODE: verify-identity
      DB_SSL_CA_FILE: /run/config/db-ca.pem
      DB_SSL_SERVERNAME: ${SPX_DB_SSL_SERVERNAME:?SPX_DB_SSL_SERVERNAME is required}
    secrets:
      - source: db_password_worker_ptwl_split
        target: db_password
    volumes:
      - type: bind
        source: ${SPX_DB_CA_PATH:?SPX_DB_CA_PATH is required}
        target: /run/config/db-ca.pem
        read_only: true
    networks:
      n-minus-one-internal:

networks:
  default:
    name: spx-staging
    labels:
      com.spx.environment: staging
      com.spx.compose-project: spx-staging
  staging-db-egress:
    name: spx-staging-db-egress
    labels:
      com.spx.environment: staging
      com.spx.purpose: staging-db-proxy-egress
  n-minus-one-internal:
    internal: true
  n-minus-one-db-egress:
    name: spx-staging-n-minus-one-db-egress
    labels:
      com.spx.environment: staging
      com.spx.purpose: n-minus-one-db-only

volumes:
  line-state-legacy:
    name: spx-staging-line-state-legacy
  line-images-legacy:
    name: spx-staging-line-images-legacy
  line-state-split:
    name: spx-staging-line-state-split
  line-images-split:
    name: spx-staging-line-images-split
  ocr-auth:
    name: spx-staging-ocr-auth
  spool-worker-ifn-split:
    name: spx-staging-spool-worker-ifn-split
  spool-worker-ptwl-split:
    name: spx-staging-spool-worker-ptwl-split
  spool-worker-ifn:
    name: spx-staging-spool-worker-ifn
  spool-worker-ptwl:
    name: spx-staging-spool-worker-ptwl
  spool-poller-ifn-phase3:
    name: spx-staging-spool-poller-ifn-phase3
  spool-auto-accept-ifn-phase3:
    name: spx-staging-spool-auto-accept-ifn-phase3
  spool-poller-ptwl-phase3:
    name: spx-staging-spool-poller-ptwl-phase3
  spool-auto-accept-ptwl-phase3:
    name: spx-staging-spool-auto-accept-ptwl-phase3
